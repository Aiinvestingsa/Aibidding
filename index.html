<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Music Social</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
 body{font-family:Inter;background:#0a0a0b;color:white}
 h1,h2{font-family:Syne}
.glass{backdrop-filter:blur(20px);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1)}
.track-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,0.4)}
</style>
</head>
<body>
<div class="max-w-7xl mx-auto p-4 md:p-6">
  <header class="flex justify-between items-center glass rounded-[20px] px-6 py-4 mb-8">
    <div class="flex items-center gap-3"><div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-black font-bold">M</div><h1 class="text-xl font-bold">AI MUSIC SOCIAL</h1></div>
    <button onclick="openUpload()" class="bg-white text-black px-5 py-2.5 rounded-full font-bold text-sm">+ Upload Track</button>
  </header>
  <div class="flex gap-2 mb-6">
    <input id="search" oninput="loadTracks()" placeholder="Search tracks, artists..." class="flex-1 glass rounded-full px-5 py-3 outline-none">
    <select id="filterModel" onchange="loadTracks()" class="glass rounded-full px-5 py-3"><option value="">All Models</option><option>Suno v3.5</option><option>Udio 1.5</option><option>Stable Audio</option></select>
  </div>
  <div id="tracks" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">Loading from Supabase...</div>
</div>

<!-- UPLOAD MODAL -->
<div id="uploadModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-[#18181b] border border-white/10 rounded-[24px] p-7 w-full max-w-md">
    <h2 class="text-2xl font-bold mb-5">Upload AI Track</h2>
    <input id="title" placeholder="Track title *" class="w-full bg-zinc-800 rounded-xl p-3.5 mb-3 outline-none">
    <input id="artist" placeholder="Your artist name @you" class="w-full bg-zinc-800 rounded-xl p-3.5 mb-3 outline-none">
    <div class="grid grid-cols-2 gap-3 mb-3">
      <select id="model" class="bg-zinc-800 rounded-xl p-3.5"><option>Suno v3.5</option><option>Udio 1.5</option><option>Stable Audio</option><option>Riffusion</option></select>
      <select id="genre" class="bg-zinc-800 rounded-xl p-3.5"><option>Amapiano</option><option>Afro House</option><option>Hip Hop</option><option>Lo-fi</option><option>Electronic</option></select>
    </div>
    <textarea id="prompt" placeholder="Prompt used..." class="w-full bg-zinc-800 rounded-xl p-3.5 mb-3 outline-none h-20"></textarea>
    <input type="file" id="file" accept="audio/*" class="w-full bg-zinc-800 rounded-xl p-3.5 mb-4">
    <p id="status" class="text-xs text-zinc-400 mb-3"></p>
    <div class="flex gap-3">
      <button onclick="uploadTrack()" id="uploadBtn" class="flex-1 bg-white text-black py-3.5 rounded-full font-bold">Upload Live</button>
      <button onclick="closeUpload()" class="flex-1 bg-zinc-800 py-3.5 rounded-full font-bold">Cancel</button>
    </div>
  </div>
</div>

<script>
// === YOUR SUPABASE CONFIG ===
const SUPABASE_URL = "https://ognqdvdzuufdygkhzae.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nbmRxdmR6dXV1ZmR5Z2toemFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzNjEsImV4cCI6MjEwNDI2NzM2MX0.sPRCVdn9CrEnN48xw8M0FSbGp4UCmkfrU93dHDqE5_4";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function openUpload(){document.getElementById('uploadModal').classList.remove('hidden')}
function closeUpload(){document.getElementById('uploadModal').classList.add('hidden')}

async function loadTracks(){
  let query = supabaseClient.from('tracks').select('*').order('created_at',{ascending:false});
  const search = document.getElementById('search').value.toLowerCase();
  const model = document.getElementById('filterModel').value;
  let {data, error} = await query;
  if(error){document.getElementById('tracks').innerHTML=error.message; return;}
  if(search) data = data.filter(t => (t.title+t.artist+t.model).toLowerCase().includes(search));
  if(model) data = data.filter(t => t.model===model);
  document.getElementById('tracks').innerHTML = data.map(t=>`
    <div class="glass rounded-[20px] p-4 track-card transition-all duration-300">
      <div class="h-36 rounded-[16px] mb-4 relative overflow-hidden" style="background:${t.color || 'linear-gradient(135deg,#10b981,#06b6d4)'}">
        <button onclick="playAudio('${t.url}')" class="absolute inset-0 flex items-center justify-center"><div class="w-14 h-14 bg-white/90 rounded-full flex items-center justify-center text-black text-xl">▶</div></button>
      </div>
      <h3 class="font-bold truncate">${t.title}</h3>
      <p class="text-xs text-zinc-400 mb-3">${t.artist} • ${t.model} • ${t.genre || ''}</p>
      <audio controls src="${t.url}" class="w-full h-8"></audio>
      <div class="flex justify-between items-center mt-3">
        <button onclick="likeTrack('${t.id}', ${t.likes||0})" class="text-sm flex items-center gap-1 hover:text-red-400">❤️ ${t.likes||0}</button>
        <span class="text-xs text-zinc-500">${t.prompt? t.prompt.substring(0,30)+'...' : ''}</span>
      </div>
    </div>
  `).join('') || '<p class="text-zinc-500 col-span-3 text-center py-20">No tracks yet. Be first to upload!</p>';
}

async function uploadTrack(){
  const file = document.getElementById('file').files[0];
  if(!file ||!document.getElementById('title').value) return alert('Title + audio file required');
  const btn = document.getElementById('uploadBtn');
  btn.innerText='Uploading...'; btn.disabled=true;
  document.getElementById('status').innerText='Uploading to Supabase Storage...';
  try{
    const fileName = Date.now()+'_'+file.name.replace(/\s/g,'_');
    const {error: upErr} = await supabaseClient.storage.from('tracks').upload(fileName, file);
    if(upErr) throw upErr;
    const {data: urlData} = supabaseClient.storage.from('tracks').getPublicUrl(fileName);
    const {error} = await supabaseClient.from('tracks').insert({
      id: 'track_'+Date.now(),
      title: document.getElementById('title').value,
      artist: document.getElementById('artist').value || '@anonymous',
      model: document.getElementById('model').value,
      genre: document.getElementById('genre').value,
      prompt: document.getElementById('prompt').value,
      url: urlData.publicUrl,
      likes: 0,
      color: `linear-gradient(135deg, hsl(${Math.random()*360},70%,50%), hsl(${Math.random()*360},70%,50%))`,
      created_at: Date.now()
    });
    if(error) throw error;
    closeUpload(); loadTracks(); alert('Live! Track uploaded ✅');
  }catch(e){ alert('Error: '+e.message); document.getElementById('status').innerText=e.message; }
  btn.innerText='Upload Live'; btn.disabled=false;
}

async function likeTrack(id, likes){
  await supabaseClient.from('tracks').update({likes: likes+1}).eq('id', id);
  loadTracks();
}
function playAudio(url){ const a = new Audio(url); a.play(); }
loadTracks();
</script>
</body>
</html>
