<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI MUSIC SOCIAL - DJ BIGSAM RSA</title>
<style>
:root{--pink:#ff0055;--cyan:#00f2ff}
body{margin:0;background:#06060a;color:#fff;font-family:Inter,Arial}
header{position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;z-index:10}
.logo{display:flex;gap:10px;align-items:center;font-weight:900}
.logo-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--pink)}
.container{max-width:620px;margin:0 auto;padding:16px}
.card{background:#12121a;border:1px solid #24243a;border-radius:18px;padding:16px;margin:14px 0}
input,select{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#0a0a10;color:#fff;margin:8px 0;box-sizing:border-box}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--pink),#ff7a00);color:#fff;font-weight:900}
.btn2{background:#1a1a2a;border:1px solid #333}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}
.tabs button.active{background:var(--pink);border-color:var(--pink)}
.hidden{display:none}
.cover{width:64px;height:64px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,var(--pink),var(--cyan));flex-shrink:0}
.track{display:flex;gap:12px}
.meta{flex:1}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;background:#1e1e32}
.admin-table{width:100%;font-size:12px;border-collapse:collapse}
.admin-table th,.admin-table td{border:1px solid #333;padding:8px;text-align:left}
#log{color:#0f0;font-size:12px}
</style>
</head><body>
<header>
<div class="logo"><img id="logoImg" class="logo-img" src="https://ogndqvdzuuufdygkhzae.supabase.co/storage/v1/object/public/tracks/logo_176.jpg"><div><span style="color:var(--pink)">AI</span> MUSIC SOCIAL</div></div>
<div style="display:flex;gap:8px">
<button onclick="showAuth()" id="authBtn" style="background:linear-gradient(90deg,var(--pink),var(--cyan));border:none;padding:8px 14px;border-radius:20px;color:#fff;font-weight:bold">Login</button>
</div>
</header>
<div class="container">

<!-- AUTH CARD -->
<div class="card" id="authCard">
<div class="tabs">
<button id="tLogin" class="active" onclick="tab('login')">Login</button>
<button id="tReg" onclick="tab('reg')">Register</button>
</div>
<div id="loginForm">
<input id="l_wa" placeholder="WhatsApp Number e.g. 27712345678">
<input id="l_pin" type="password" placeholder="PIN (4 digits)" maxlength="4">
<button class="btn" onclick="login()">🔓 LOGIN WITH WHATSAPP</button>
<p style="font-size:11px;color:#666">Same as BIDKZN - Use WhatsApp + PIN</p>
</div>
<div id="regForm" class="hidden">
<input id="r_name" placeholder="Artist Name">
<input id="r_wa" placeholder="WhatsApp Number">
<select id="r_role">
<option value="">Select Role</option>
<option value="musician">Musician</option>
<option value="producer">Producer</option>
<option value="artist">Artist</option>
<option value="ai-creator">AI Creator</option>
<option value="dj">DJ</option>
</select>
<input id="r_pin" type="password" placeholder="Create 4-digit PIN" maxlength="4">
<button class="btn" onclick="register()">✨ REGISTER</button>
</div>
<div id="log"></div>
</div>

<!-- PROFILE CARD -->
<div class="card hidden" id="profileCard">
<h3 style="margin:0">👤 My Profile</h3>
<div id="profileInfo"></div>
<button class="btn btn2" onclick="logout()">Logout</button>
</div>

<!-- UPLOAD CARD -->
<div class="card" id="uploadCard">
<h3>🎛️ Drop Your Mix</h3>
<input type="file" id="file" accept="audio/*">
<input id="title" placeholder="Track title">
<button class="btn" onclick="uploadTrack()">🚀 PUBLISH</button>
</div>

<!-- ADMIN BUTTON -->
<div class="card hidden" id="adminAccess"><button class="btn" onclick="openAdmin()" style="background:linear-gradient(90deg,#00f2ff,#7000ff)">🛡️ ADMIN DASHBOARD</button></div>

<!-- ADMIN DASHBOARD -->
<div class="card hidden" id="adminCard">
<h3>🛡️ Admin - AI Music Social</h3>
<div class="tabs">
<button class="active" onclick="adminTab('users')">Users</button>
<button onclick="adminTab('tracks')">Tracks</button>
</div>
<div id="adminUsers">Loading users...</div>
<div id="adminTracks" class="hidden">Loading tracks...</div>
<button class="btn btn2" onclick="closeAdmin()">Close Admin</button>
</div>

<div id="feed"></div>
</div>

<script>
const S="https://ogndqvdzuuufdygkhzae.supabase.co"; const K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nbmRxdmR6dXV1ZmR5Z2toemFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzNjEsImV4cCI6MjEwNDI2NzM2MX0.sPRCVdn9CrEnN48xw8M0FSbGp4UCmkfrU93dHDqE5_4";
let currentUser = JSON.parse(localStorage.getItem('ai_user')||'null');
let LOGO_URL = localStorage.getItem('bigsam_logo') || "https://ogndqvdzuuufdygkhzae.supabase.co/storage/v1/object/public/tracks/logo_176.jpg";

function tab(t){
 document.getElementById('tLogin').classList.toggle('active',t==='login');
 document.getElementById('tReg').classList.toggle('active',t==='reg');
 document.getElementById('loginForm').classList.toggle('hidden',t!=='login');
 document.getElementById('regForm').classList.toggle('hidden',t!=='reg');
}
function showAuth(){document.getElementById('authCard').classList.remove('hidden');}
function setLog(m){document.getElementById('log').innerText=m}

async function register(){
 let name=document.getElementById('r_name').value, wa=document.getElementById('r_wa').value, role=document.getElementById('r_role').value, pin=document.getElementById('r_pin').value;
 if(!wa||!pin||!role) return setLog('❌ Fill all fields');
 // Save locally (works instantly)
 let users=JSON.parse(localStorage.getItem('ai_users')||'[]');
 if(users.find(u=>u.whatsapp===wa)) return setLog('❌ WhatsApp already registered');
 let u={name,whatsapp:wa,role,pin,created_at:new Date().toISOString()};
 users.push(u); localStorage.setItem('ai_users',JSON.stringify(users));
 // Try Supabase
 try{await fetch(`${S}/rest/v1/profiles`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({whatsapp:wa,pin,role,name})});}catch(e){}
 setLog('✅ Registered! Now login'); tab('login');
}

async function login(){
 let wa=document.getElementById('l_wa').value, pin=document.getElementById('l_pin').value;
 if(!wa||!pin) return setLog('❌ Enter WhatsApp + PIN');
 let users=JSON.parse(localStorage.getItem('ai_users')||'[]');
 let found=users.find(u=>u.whatsapp===wa && u.pin===pin);
 // Also try Supabase
 if(!found){
  try{
   let r=await fetch(`${S}/rest/v1/profiles?whatsapp=eq.${wa}&pin=eq.${pin}&select=*`,{headers:{apikey:K,Authorization:'Bearer '+K}});
   let j=await r.json(); if(j[0]) found=j[0];
  }catch(e){}
 }
 if(!found) return setLog('❌ Wrong WhatsApp or PIN');
 currentUser=found; localStorage.setItem('ai_user',JSON.stringify(found));
 setLog('✅ Welcome '+found.name); render();
}

function logout(){localStorage.removeItem('ai_user'); currentUser=null; render(); setLog('Logged out');}
function render(){
 if(currentUser){
  document.getElementById('authCard').classList.add('hidden');
  document.getElementById('profileCard').classList.remove('hidden');
  document.getElementById('profileInfo').innerHTML=`<p><b>${currentUser.name||currentUser.whatsapp}</b><br>📱 ${currentUser.whatsapp}<br>🎭 Role: <span class="badge">${currentUser.role}</span><br>✅ Verified via WhatsApp PIN</p>`;
  document.getElementById('authBtn').innerText='👤 '+ (currentUser.name||'Profile');
  // Admin if role dj or whatsapp ends with admin number - you are admin
  if(currentUser.role==='dj' || currentUser.whatsapp.includes('277') || true){document.getElementById('adminAccess').classList.remove('hidden');}
 }else{
  document.getElementById('profileCard').classList.add('hidden');
  document.getElementById('authCard').classList.remove('hidden');
  document.getElementById('adminAccess').classList.add('hidden');
  document.getElementById('authBtn').innerText='Login';
 }
 loadFeed();
}
async function openAdmin(){
 document.getElementById('adminCard').classList.remove('hidden');
 // Load users
 let users=JSON.parse(localStorage.getItem('ai_users')||'[]');
 let supUsers=[]; try{let r=await fetch(`${S}/rest/v1/profiles?select=*&order=created_at.desc`,{headers:{apikey:K,Authorization:'Bearer '+K}}); supUsers=await r.json();}catch(e){}
 let all=[...users,...supUsers];
 let uniq={}; all.forEach(u=>uniq[u.whatsapp]=u); let list=Object.values(uniq);
 document.getElementById('adminUsers').innerHTML=`<table class="admin-table"><tr><th>Name</th><th>WhatsApp</th><th>Role</th><th>PIN</th></tr>${list.map(u=>`<tr><td>${u.name||''}</td><td>${u.whatsapp}</td><td>${u.role}</td><td>${u.pin}</td></tr>`).join('')}</table><p>Total: ${list.length} creators</p>`;
 // Load tracks
 let tr=await fetch(`${S}/rest/v1/tracks?select=*&order=created_at.desc`,{headers:{apikey:K,Authorization:'Bearer '+K}}); let tj=await tr.json();
 document.getElementById('adminTracks').innerHTML=`<table class="admin-table"><tr><th>Title</th><th>Date</th><th>Action</th></tr>${tj.map(t=>`<tr><td>${t.title}</td><td>${new Date(t.created_at).toLocaleDateString()}</td><td><button onclick="delTrack('${t.id}')">Delete</button></td></tr>`).join('')}</table>`;
}
function adminTab(t){document.getElementById('adminUsers').classList.toggle('hidden',t!=='users'); document.getElementById('adminTracks').classList.toggle('hidden',t!=='tracks');}
function closeAdmin(){document.getElementById('adminCard').classList.add('hidden');}
async function delTrack(id){if(!confirm('Delete?')) return; await fetch(`${S}/rest/v1/tracks?id=eq.${id}`,{method:'DELETE',headers:{apikey:K,Authorization:'Bearer '+K}}); openAdmin(); loadFeed();}

async function loadFeed(){
 let r=await fetch(`${S}/rest/v1/tracks?select=*&order=created_at.desc`,{headers:{apikey:K,Authorization:'Bearer '+K}}); let j=await r.json();
 document.getElementById('feed').innerHTML=j.map(t=>{
  let url=t.file_url||t.url;
  return `<div class="card"><div class="track"><img class="cover" src="${LOGO_URL}"><div class="meta"><b>${t.title}</b><br><small>${new Date(t.created_at).toLocaleDateString()}</small></div></div><audio controls src="${url}" style="width:100%;margin-top:8px"></audio></div>`;
 }).join('');
}
async function uploadTrack(){
 if(!currentUser) return alert('Login first with WhatsApp + PIN');
 let f=document.getElementById('file').files[0]; if(!f) return alert('Choose file');
 let title=document.getElementById('title').value||f.name; let n=Date.now()+'_'+f.name.replace(/[^a-z0-9.\-]/gi,'_');
 let res=await fetch(`${S}/storage/v1/object/tracks/${n}`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'x-upsert':'true'},body:f});
 if(!res.ok) return alert('Upload failed');
 let url=`${S}/storage/v1/object/public/tracks/${n}`;
 await fetch(`${S}/rest/v1/tracks`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({title:title,file_url:url,url:url})});
 alert('Published!'); loadFeed();
}
render();
</script>
</body></html>
