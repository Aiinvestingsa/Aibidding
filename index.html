<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Music Social - Dj BIGSAM RSA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Inter;background:#050507;color:#fff}
h1{font-family:Syne}
.glass{backdrop-filter:blur(24px);background:linear-gradient(135deg,rgba(255,255,255,0.09),rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.12)}
.card{transition:.3s}.card:hover{transform:translateY(-5px)}
</style>
</head>
<body>
<div class="fixed inset-0 -z-10"><div class="absolute -top-40 -left-40 w-[700px] h-[700px] bg-emerald-500/20 rounded-full blur-[130px]"></div><div class="absolute top-1/2 -right-40 w-[600px] h-[600px] bg-violet-500/25 rounded-full blur-[130px]"></div></div>

<div class="max-w-[1200px] mx-auto p-4 md:p-6">
<header class="flex justify-between items-center glass rounded-[24px] px-6 py-4 mb-6">
<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center font-black">M</div><div><h1 class="text-[18px] font-extrabold leading-none">AI MUSIC SOCIAL</h1><p class="text-[10px] tracking-[0.2em] text-zinc-400 font-bold">SUPABASE • LIVE • DURBAN</p></div></div>
<button onclick="openModal()" class="bg-white text-black px-6 py-3 rounded-full font-bold text-sm">+ Upload</button>
</header>

<div class="flex gap-3 mb-6"><input id="search" oninput="render()" placeholder="Search Nation sa..." class="flex-1 glass rounded-full px-6 py-3.5 text-sm outline-none"><select id="filter" onchange="render()" class="glass rounded-full px-5 py-3.5 text-sm"><option value="">All Models</option><option>Suno v3.5</option><option>Udio 1.5</option></select></div>

<div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
<div id="empty" class="hidden text-center py-24 text-zinc-500">No tracks yet — upload first! 🔥</div>
</div>

<div id="player" class="hidden fixed bottom-4 left-3 right-3 md:left-1/2 md:-translate-x-1/2 md:w-[580px] bg-[#18181b]/90 backdrop-blur-2xl border border-white/15 rounded-[22px] p-3 flex items-center gap-3 z-50">
<div id="pArt" class="w-14 h-14 rounded-[14px] shrink-0"></div><div class="flex-1 min-w-0"><p id="pTitle" class="font-bold text-[15px] truncate"></p><p id="pArtist" class="text-xs text-zinc-400 truncate"></p></div><audio id="audio" controls class="h-9 w-[220px]"></audio>
</div>

<div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl z-[60] flex items-center justify-center p-4">
<div class="bg-[#141417] border border-white/10 rounded-[28px] w-full max-w-[500px] p-7">
<h2 class="text-2xl font-extrabold">Drop Your AI Track</h2><p class="text-xs text-zinc-500 mb-5">Auto-renamed so you can upload unlimited songs</p>
<input id="title" placeholder="Track Title *" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-3 outline-none">
<div class="grid grid-cols-2 gap-3 mb-3"><input id="artist" value="Dj BIGSAM RSA" class="bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm outline-none"><select id="model" class="bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm"><option>Suno v3.5</option><option>Udio 1.5</option><option>Stable Audio</option></select></div>
<input type="file" id="file" accept="audio/*" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-3 file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-white file:text-black file:font-bold">
<p id="status" class="text-xs min-h-[20px] mb-3"></p>
<button id="upBtn" onclick="upload()" class="w-full bg-white text-black py-4 rounded-full font-bold text-sm">Upload to Supabase • Go Live</button>
<button onclick="closeModal()" class="w-full mt-3 bg-white/10 py-3.5 rounded-full text-sm font-bold">Cancel</button>
</div>
</div>

<script>
const SUPABASE_URL = "https://ogndqvdzuuufdygkhzae.supabase.co";
const SUPABASE_KEY = "sb_publishable_eg-ZsTalOsWQtIDJmDQugA_Sf2iKrkD";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let allTracks = [];
function openModal(){document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}

async function fetchTracks(){
  const {data,error} = await supabaseClient.from('tracks').select('*').order('created_at',{ascending:false});
  if(error){document.getElementById('grid').innerHTML='<p class="text-red-400 p-4">'+error.message+'</p>';return;}
  allTracks=data||[];
  document.getElementById('empty').classList.toggle('hidden', allTracks.length>0);
  render();
}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const f=document.getElementById('filter').value;
  let list=allTracks.filter(t=>(t.title+t.artist).toLowerCase().includes(q)&&(!f||t.model===f));
  document.getElementById('grid').innerHTML=list.map(t=>`
    <div class="card glass rounded-[26px] p-3.5">
      <div class="h-[210px] rounded-[20px] relative overflow-hidden mb-4" style="background:${t.color}">
        <button onclick="playTrack('${t.id}')" class="absolute inset-0 flex items-center justify-center group"><div class="w-[68px] h-[68px] bg-white rounded-full flex items-center justify-center text-black shadow-xl group-hover:scale-110 transition">▶</div></button>
        <div class="absolute bottom-3 left-3 text-[11px] font-bold bg-black/40 backdrop-blur-md border border-white/10 px-3 py-1.5 rounded-full">${t.model||'Suno v3.5'}</div>
      </div>
      <div class="px-1 pb-1"><h3 class="font-bold text-[18px] truncate">${t.title}</h3><p class="text-[13px] text-zinc-400">${t.artist}</p><div class="flex justify-between items-center mt-4"><button onclick="likeTrack('${t.id}',${t.likes||0})" class="text-xs bg-white/10 px-3.5 py-2 rounded-full">❤️ ${t.likes||0}</button><button onclick="playTrack('${t.id}')" class="text-xs bg-white text-black px-6 py-2 rounded-full font-bold">Play</button></div></div>
    </div>`).join('');
}
function playTrack(id){const t=allTracks.find(x=>x.id===id);document.getElementById('pArt').style.background=t.color;document.getElementById('pTitle').innerText=t.title;document.getElementById('pArtist').innerText=t.artist;const a=document.getElementById('audio');a.src=t.url;document.getElementById('player').classList.remove('hidden');a.play();}
async function likeTrack(id,likes){await supabaseClient.from('tracks').update({likes:likes+1}).eq('id',id);fetchTracks();}

async function upload(){
  const file=document.getElementById('file').files[0];
  const title=document.getElementById('title').value.trim();
  const artist=document.getElementById('artist').value.trim()||'Dj BIGSAM RSA';
  const model=document.getElementById('model').value;
  const status=document.getElementById('status');
  const btn=document.getElementById('upBtn');
  if(!title||!file){alert('Add title + audio file');return;}
  if(file.size>50*1024*1024){alert('File too big! Max 50MB. Trim it.');return;}
  btn.disabled=true;btn.innerText='Uploading...';status.className='text-xs text-emerald-400 min-h-[20px] mb-3';status.innerText='Uploading '+file.name+'...';

  try{
    const safeName = Date.now()+'_'+Math.random().toString(36).slice(2,8)+'_'+file.name.replace(/[^a-zA-Z0-9.-]/g,'_');
    const {error:upErr} = await supabaseClient.storage.from('tracks').upload(safeName,file,{cacheControl:'3600',upsert:false});
    if(upErr) throw upErr;
    const {data} = supabaseClient.storage.from('tracks').getPublicUrl(safeName);
    const colors=['linear-gradient(135deg,#ff4ecd,#8b5cf6)','linear-gradient(135deg,#f43f5e,#ec4899)','linear-gradient(135deg,#10b981,#06b6d4)','linear-gradient(135deg,#f59e0b,#ef4444)','linear-gradient(135deg,#6366f1,#a855f7)'];
    const {error:dbErr} = await supabaseClient.from('tracks').insert({id:'track_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),title,artist,model,url:data.publicUrl,likes:0,color:colors[Math.floor(Math.random()*colors.length)],created_at:Date.now()});
    if(dbErr) throw dbErr;
    status.className='text-xs text-emerald-400';status.innerText='✅ LIVE! '+title;
    setTimeout(()=>{closeModal();status.innerText='';},1200);
    document.getElementById('title').value='';document.getElementById('file').value='';
    fetchTracks();
  }catch(e){
    status.className='text-xs text-red-400 min-h-[20px] mb-3';status.innerText='❌ '+e.message;
    alert('Upload error: '+e.message);
  }finally{btn.disabled=false;btn.innerText='Upload to Supabase • Go Live';}
}
fetchTracks();
</script>
</body>
</html>
