<!DOCTYPE html>
<html><body style="background:#000;color:#fff;font-family:sans-serif;padding:20px">
<h2>Dj BIGSAM - QUICK UPLOAD FIX</h2>
<input id="title" placeholder="Title" style="width:100%;padding:15px;margin:10px 0;border-radius:10px"><br>
<input type="file" id="file" accept="audio/*"><br><br>
<button onclick="upload()" style="padding:15px 30px;border-radius:20px;font-weight:bold">UPLOAD NOW</button>
<p id="log"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const supa=supabase.createClient("https://ogndqvdzuuufdygkhzae.supabase.co","sb_publishable_eg-ZsTalOsWQtIDJmDQugA_Sf2iKrkD");
async function upload(){
 const f=document.getElementById('file').files[0];const t=document.getElementById('title').value;
 document.getElementById('log').innerText='Uploading '+f.name+'... keep screen on';
 try{
  const name=Date.now()+'_'+f.name.replace(/[^a-z0-9.-]/gi,'_');
  const {error:e1}=await supa.storage.from('tracks').upload(name,f);
  if(e1){document.getElementById('log').innerText='STORAGE ERROR: '+e1.message;alert(e1.message);return;}
  const {data}=supa.storage.from('tracks').getPublicUrl(name);
  const {error:e2}=await supa.from('tracks').insert({id:'track_'+Date.now(),title:t,artist:'Dj BIGSAM RSA',url:data.publicUrl,color:'linear-gradient(135deg,#ff4ecd,#8b5cf6)',likes:0,created_at:Date.now()});
  if(e2){document.getElementById('log').innerText='DB ERROR: '+e2.message;alert(e2.message);return;}
  document.getElementById('log').innerText='✅ DONE! '+t+' LIVE! Go to restingsa.github.io';
 }catch(err){document.getElementById('log').innerText='ERROR: '+err.message;alert(err.message)}
}
</script>
</body></html>
