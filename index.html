<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Music Social - Dj BIGSAM RSA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:Inter;background:#050507;color:#fff}h1{font-family:Syne}.glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(24px)}</style>
</head>
<body>
<div class="max-w-[1200px] mx-auto p-4">
<header class="flex justify-between items-center glass rounded-[24px] px-6 py-4 mb-6">
<div class="flex items-center gap-3"><div class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-black">M</div><div><h1 class="font-extrabold text-[13px]">AI MUSIC SOCIAL</h1><p class="text-[10px] text-zinc-500" id="count">LOADING...</p></div></div>
<div class="flex gap-2 items-center"><span id="userShow" class="text-xs text-zinc-400 hidden md:block"></span><button id="loginBtn" onclick="openLogin()" class="bg-white/10 px-4 py-2 rounded-full text-xs">Login</button><button onclick="openUpload()" class="bg-white text-black px-5 py-2.5 rounded-full font-bold text-xs">+ Upload</button></div>
</header>
<div id="grid" class="grid md:grid-cols-3 gap-6"></div>
</div>

<div id="player" class="hidden fixed bottom-4 left-3 right-3 md:left-1/2 md:-translate-x-1/2 md:w-[600px] bg-[#18181b]/95 border border-white/10 rounded-[20px] p-3 flex items-center gap-3 z-50"><div id="pArt" class="w-12 h-12 rounded-xl"></div><div class="flex-1"><p id="pTitle" class="font-bold text-sm"></p><p id="pArtist" class="text-xs text-zinc-400"></p></div><audio id="audio" controls class="w-[180px] h-8"></audio></div>

<!-- WHATSAPP LOGIN MODAL -->
<div id="loginModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl z-[80] flex items-center justify-center p-4">
<div class="bg-[#141417] border border-white/10 rounded-[28px] w-full max-w-[360px] p-7 text-center">
<div class="w-14 h-14 bg-[#25D366] rounded-full grid place-items-center mx-auto mb-3 text-2xl">💬</div>
<h2 class="text-xl font-bold">Login with WhatsApp</h2><p class="text-xs text-zinc-500 mt-1 mb-5">Your number is your account • 1 number = 1 account</p>
<div class="flex gap-2 mb-3"><span class="bg-[#1e1e21] rounded-2xl px-4 py-4 text-sm">🇿🇦 +27</span><input id="whatsapp" type="tel" inputmode="numeric" placeholder="82 123 4567" class="flex-1 bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm outline-none"></div>
<input id="pin" type="password" maxlength="4" inputmode="numeric" placeholder="4-digit PIN" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-2 outline-none text-center tracking-[0.6em]">
<input id="name" placeholder="Your DJ / Artist Name (first time only)" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-4 outline-none">
<button onclick="doLogin()" class="w-full bg-[#25D366] text-black py-4 rounded-full font-bold text-sm">Login / Register</button>
<button onclick="closeLogin()" class="w-full mt-3 bg-white/10 py-3 rounded-full text-sm">Close</button>
<p id="loginMsg" class="text-[11px] text-red-400 mt-3 hidden"></p>
</div>
</div>

<!-- UPLOAD MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl z-[60] flex items-center justify-center p-4">
<div class="bg-[#141417] border border-white/10 rounded-[28px] w-full max-w-[500px] p-7">
<div id="formBox"><h2 class="text-xl font-bold mb-4">Upload Track</h2><input id="title" placeholder="Song Title" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-3 outline-none"><input id="artist" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-3 outline-none"><input type="file" id="file" accept="audio/*" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-3"><button onclick="doUpload()" class="w-full bg-white text-black py-4 rounded-full font-bold text-sm">Upload Now</button><button onclick="document.getElementById('modal').classList.add('hidden')" class="w-full mt-3 bg-white/10 py-3 rounded-full text-sm">Close</button></div>
<div id="loadBox" class="hidden text-center py-6"><h3 id="lTitle" class="text-lg font-bold">Uploading...</h3><div class="mt-5 w-full bg-white/10 rounded-full h-2 overflow-hidden"><div id="prog" class="h-full bg-white w-0"></div></div><p id="lPer" class="text-[11px] text-zinc-500 mt-2">0%</p></div>
</div>
</div>

<script>
const supa=supabase.createClient("https://ogndqvdzuuufdygkhzae.supabase.co","sb_publishable_eg-ZsTalOsWQtIDJmDQugA_Sf2iKrkD");
let all=[]; let myIP=null; let currentUser=JSON.parse(localStorage.getItem('music_user')||'null');
async function getIP(){ if(myIP) return myIP; try{const r=await fetch('https://api.ipify.org?format=json'); const j=await r.json(); myIP=j.ip;}catch{myIP='fp_'+btoa(navigator.userAgent).slice(0,20);} return myIP; } getIP();
function updateUserUI(){
 if(currentUser){
  document.getElementById('userShow').innerText='💬 '+currentUser.whatsapp;
  document.getElementById('loginBtn').innerText='Logout';
  document.getElementById('loginBtn').onclick=logout;
  document.getElementById('artist').value=currentUser.name||'Dj BIGSAM RSA';
 }else{
  document.getElementById('userShow').innerText='';
  document.getElementById('loginBtn').innerText='Login';
  document.getElementById('loginBtn').onclick=openLogin;
 }
}
function openLogin(){ document.getElementById('loginModal').classList.remove('hidden'); } function closeLogin(){ document.getElementById('loginModal').classList.add('hidden'); }
function openUpload(){ if(!currentUser){ openLogin(); alert('Login with WhatsApp first!'); return; } document.getElementById('modal').classList.remove('hidden'); }
function cleanNumber(n){ return n.replace(/\D/g,'').replace(/^0+/,'').slice(-9); } // 821234567

async function doLogin(){
 const raw=document.getElementById('whatsapp').value; const pin=document.getElementById('pin').value.trim(); const name=document.getElementById('name').value.trim();
 const num=cleanNumber(raw);
 if(num.length!==9||pin.length!==4||isNaN(pin)){ document.getElementById('loginMsg').innerText='Enter 9-digit number (82 123 4567) + 4-digit PIN'; document.getElementById('loginMsg').classList.remove('hidden'); return; }
 const whatsapp='+27'+num;
 const {data:existing}=await supa.from('users').select('*').eq('whatsapp',whatsapp).single();
 if(existing){
  if(existing.pin!==pin){ document.getElementById('loginMsg').innerText='Wrong PIN for '+whatsapp; document.getElementById('loginMsg').classList.remove('hidden'); return; }
  currentUser=existing;
 } else {
  if(!name){ document.getElementById('loginMsg').innerText='First time? Enter your name'; document.getElementById('loginMsg').classList.remove('hidden'); return; }
  const id='user_'+Date.now();
  const {data,error}=await supa.from('users').insert({id, whatsapp, pin, name}).select().single();
  if(error){ alert(error.message); return; }
  currentUser=data;
 }
 localStorage.setItem('music_user', JSON.stringify(currentUser)); updateUserUI(); closeLogin();
}
function logout(){ localStorage.removeItem('music_user'); currentUser=null; updateUserUI(); }

async function load(){
 const {data}=await supa.from('tracks').select('*').order('created_at',{ascending:false});
 let counts=[]; try{const {data:c}=await supa.rpc('get_true_counts'); counts=c||[];}catch{}
 all=(data||[]).map(t=>{const c=counts.find(x=>x.id===t.id); return {...t, views:c?Number(c.real_views):0, downloads:c?Number(c.real_downloads):0};});
 document.getElementById('count').innerText=all.length+' TRACKS • WHATSAPP LOGIN';
 document.getElementById('grid').innerHTML=all.map(t=>`<div class="glass rounded-[26px] p-3"><div class="h-[180px] rounded-[20px] relative" style="background:${t.color}"><button onclick="playTrack('${t.id}')" class="absolute inset-0 grid place-items-center"><div class="w-14 h-14 bg-white rounded-full grid place-items-center text-black">▶</div></button><div class="absolute top-3 left-3 flex gap-2"><span class="text-[10px] bg-black/70 px-2 py-1 rounded-full">👁️ ${t.views}</span><span class="text-[10px] bg-black/70 px-2 py-1 rounded-full">⬇️ ${t.downloads}</span></div></div><div class="p-2"><h3 class="font-bold truncate">${t.title}</h3><p class="text-xs text-zinc-400">${t.artist}</p><div class="flex justify-between mt-3"><button onclick="likeTrack('${t.id}')" class="text-xs bg-white/10 px-3 py-1.5 rounded-full">❤️ ${t.likes||0}</button><div class="flex gap-2"><button onclick="downloadTrack('${t.id}')" class="text-xs bg-white text-black px-4 py-1.5 rounded-full font-bold">⬇️ Download</button><button onclick="playTrack('${t.id}')" class="text-xs bg-white/10 px-3 py-1.5 rounded-full">Play</button></div></div></div></div>`).join('');
}
async function playTrack(id){ const t=all.find(x=>x.id==id); document.getElementById('pArt').style.background=t.color; document.getElementById('pTitle').innerText=t.title; document.getElementById('pArtist').innerText=t.artist; document.getElementById('audio').src=t.url; document.getElementById('player').classList.remove('hidden'); document.getElementById('audio').play(); const ip=await getIP(); await supa.from('track_views').insert({track_id:id, ip}); load(); }
async function likeTrack(id){ if(!currentUser){openLogin(); return;} if(localStorage.getItem('liked_'+id)){alert('Already liked'); return;} const t=all.find(x=>x.id==id); await supa.from('tracks').update({likes:(t.likes||0)+1}).eq('id',id); localStorage.setItem('liked_'+id,'1'); load(); }
async function downloadTrack(id){
 if(!currentUser){ openLogin(); alert('🔒 Login with WhatsApp + PIN to download!'); return; }
 const ip=await getIP(); await supa.from('track_downloads').insert({track_id:id, ip}); load();
 const t=all.find(x=>x.id==id); const a=document.createElement('a'); a.href=t.url; a.download=t.title+'.mp3'; a.target='_blank'; a.click();
}
async function doUpload(){
 if(!currentUser){openLogin(); return;}
 const f=document.getElementById('file').files[0]; const title=document.getElementById('title').value.trim(); if(!title||!f){alert('Add title + file'); return;}
 document.getElementById('formBox').classList.add('hidden'); document.getElementById('loadBox').classList.remove('hidden');
 try{
  const name=Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9.-]/g,'_');
  await supa.storage.from('tracks').upload(name,f,{upsert:true});
  const {data}=supa.storage.from('tracks').getPublicUrl(name);
  await supa.from('tracks').insert({id:'track_'+Date.now(),title,artist:document.getElementById('artist').value,color:'linear-gradient(135deg,#ff4ecd,#8b5cf6)',url:data.publicUrl,likes:0,created_at:Date.now()});
  document.getElementById('modal').classList.add('hidden'); document.getElementById('formBox').classList.remove('hidden'); document.getElementById('loadBox').classList.add('hidden'); load();
 }catch(e){alert(e.message);}
}
updateUserUI(); load();
</script>
</body>
</html>
