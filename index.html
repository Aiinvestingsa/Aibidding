<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Music Social - Dj BIGSAM RSA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:Inter;background:#050507;color:#fff}h1{font-family:Syne}.glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(24px)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes wave{0%,100%{height:8px}50%{height:28px}}.ring{width:56px;height:56px;border:4px solid #222;border-top-color:#fff;border-radius:50%;animation:spin.8s linear infinite}.bar{width:5px;background:#fff;border-radius:10px;animation:wave.8s ease infinite}.bar:nth-child(2){animation-delay:.1s}.bar:nth-child(3){animation-delay:.2s}.bar:nth-child(4){animation-delay:.3s}.bar:nth-child(5){animation-delay:.4s}</style>
</head>
<body>
<div class="max-w-[1200px] mx-auto p-4">
<header class="flex justify-between items-center glass rounded-[24px] px-6 py-4 mb-6"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-black">M</div><div><h1 class="font-extrabold">AI MUSIC SOCIAL</h1><p class="text-[10px] tracking-widest text-zinc-500" id="count">LOADING...</p></div></div><button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-white text-black px-6 py-3 rounded-full font-bold text-sm">+ Upload</button></header>
<div id="loader" class="text-center py-20"><div class="flex justify-center mb-4"><div class="ring"></div></div><div class="flex justify-center gap-1 h-8 items-center"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><p class="text-sm mt-4 text-zinc-400">Loading tracks...</p></div>
<div id="grid" class="grid md:grid-cols-3 gap-6 hidden"></div>
<div id="error" class="hidden text-center py-10"><button onclick="load()" class="bg-white text-black px-6 py-2 rounded-full text-sm font-bold">Retry</button></div>
</div>
<div id="player" class="hidden fixed bottom-4 left-3 right-3 md:left-1/2 md:-translate-x-1/2 md:w-[600px] bg-[#18181b]/95 border border-white/10 rounded-[20px] p-3 flex items-center gap-3 z-50"><div id="pArt" class="w-12 h-12 rounded-xl"></div><div class="flex-1 min-w-0"><p id="pTitle" class="font-bold text-sm truncate"></p><p id="pArtist" class="text-xs text-zinc-400"></p><p class="text-[10px] text-zinc-500" id="pStats"></p></div><audio id="audio" controls class="w-[180px] h-8"></audio></div>

<div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl z-[60] flex items-center justify-center p-4">
<div class="bg-[#141417] border border-white/10 rounded-[28px] w-full max-w-[500px] p-7">
<div id="formBox"><h2 class="text-xl font-bold mb-4">Upload Track</h2><input id="title" placeholder="Title" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-3 outline-none"><input id="artist" value="Dj BIGSAM RSA" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-3 outline-none"><input type="file" id="file" accept="audio/*" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-3"><button onclick="doUpload()" class="w-full bg-white text-black py-4 rounded-full font-bold text-sm">Upload Now</button><button onclick="document.getElementById('modal').classList.add('hidden')" class="w-full mt-3 bg-white/10 py-3 rounded-full text-sm">Close</button></div>
<div id="loadBox" class="hidden text-center py-6"><div class="flex justify-center mb-4"><div class="ring"></div></div><div class="flex justify-center gap-1 h-8 items-center mb-4"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><h3 id="lTitle" class="text-lg font-bold">Uploading...</h3><p id="lSub" class="text-xs text-zinc-400 mt-1">Keep screen on</p><div class="mt-5 w-full bg-white/10 rounded-full h-2 overflow-hidden"><div id="prog" class="h-full bg-white w-0 transition-all"></div></div><p id="lPer" class="text-[11px] text-zinc-500 mt-2">0%</p></div>
</div>
</div>

<script>
const supa=supabase.createClient("https://ogndqvdzuuufdygkhzae.supabase.co","sb_publishable_eg-ZsTalOsWQtIDJmDQugA_Sf2iKrkD");
let all=[];
async function load(){
 try{
  const {data,error}=await supa.from('tracks').select('*').order('created_at',{ascending:false});
  if(error) throw error; all=data||[];
  document.getElementById('count').innerText=all.length+' TRACKS LIVE • DURBAN';
  document.getElementById('loader').classList.add('hidden'); document.getElementById('grid').classList.remove('hidden');
  document.getElementById('grid').innerHTML=all.map(t=>`
   <div class="glass rounded-[26px] p-3 hover:border-white/20 transition">
    <div class="h-[200px] rounded-[20px] relative" style="background:${t.color}">
     <button onclick="playTrack('${t.id}')" class="absolute inset-0 grid place-items-center"><div class="w-14 h-14 bg-white rounded-full grid place-items-center text-black">▶</div></button>
     <div class="absolute top-3 left-3 flex gap-2">
      <span class="text-[10px] bg-black/60 backdrop-blur px-2 py-1 rounded-full">👁️ ${t.views||0}</span>
      <span class="text-[10px] bg-black/60 backdrop-blur px-2 py-1 rounded-full">⬇️ ${t.downloads||0}</span>
     </div>
    </div>
    <div class="p-2">
     <h3 class="font-bold truncate">${t.title}</h3><p class="text-xs text-zinc-400">${t.artist}</p>
     <div class="flex justify-between items-center mt-3">
      <div class="flex gap-2">
       <button onclick="likeTrack('${t.id}')" class="text-xs bg-white/10 px-3 py-1.5 rounded-full">❤️ ${t.likes||0}</button>
       <button onclick="downloadTrack('${t.id}')" class="text-xs bg-white/10 px-3 py-1.5 rounded-full">⬇️</button>
      </div>
      <button onclick="playTrack('${t.id}')" class="text-xs bg-white text-black px-4 py-1.5 rounded-full font-bold">Play</button>
     </div>
    </div>
   </div>`).join('');
 }catch(e){document.getElementById('loader').classList.add('hidden');document.getElementById('error').classList.remove('hidden');}
}
function playTrack(id){
 const t=all.find(x=>x.id==id); if(!t) return;
 document.getElementById('pArt').style.background=t.color;document.getElementById('pTitle').innerText=t.title;document.getElementById('pArtist').innerText=t.artist;document.getElementById('pStats').innerText=`👁️ ${t.views||0} views • ❤️ ${t.likes||0} likes • ⬇️ ${t.downloads||0} downloads`;
 const a=document.getElementById('audio');a.src=t.url;document.getElementById('player').classList.remove('hidden');a.play();
 // VIEW COUNT - only once per session
 if(!sessionStorage.getItem('viewed_'+id)){
  supa.from('tracks').update({views:(t.views||0)+1}).eq('id',id).then(()=>{t.views=(t.views||0)+1;load();});
  sessionStorage.setItem('viewed_'+id,'1');
 }
}
async function likeTrack(id){
 const t=all.find(x=>x.id==id);
 if(localStorage.getItem('liked_'+id)){alert('You already liked this! ❤️');return;}
 await supa.from('tracks').update({likes:(t.likes||0)+1}).eq('id',id);
 t.likes=(t.likes||0)+1; localStorage.setItem('liked_'+id,'1'); load();
}
async function downloadTrack(id){
 const t=all.find(x=>x.id==id);
 // count download
 await supa.from('tracks').update({downloads:(t.downloads||0)+1}).eq('id',id);
 t.downloads=(t.downloads||0)+1; load();
 // actual download
 const a=document.createElement('a'); a.href=t.url; a.download=t.title+'.mp3'; a.target='_blank'; a.click();
}
async function doUpload(){
 const f=document.getElementById('file').files[0];const title=document.getElementById('title').value.trim();
 if(!title||!f){alert('Add title + file');return;}
 document.getElementById('formBox').classList.add('hidden');document.getElementById('loadBox').classList.remove('hidden');
 const lTitle=document.getElementById('lTitle'),lSub=document.getElementById('lSub'),prog=document.getElementById('prog'),lPer=document.getElementById('lPer');
 lTitle.innerText='Uploading '+title; let p=0;const timer=setInterval(()=>{p=Math.min(p+5,90);prog.style.width=p+'%';lPer.innerText=p+'%';},400);
 try{
  const name=Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9.-]/g,'_');
  const {error:e1}=await supa.storage.from('tracks').upload(name,f,{upsert:true}); if(e1) throw e1;
  clearInterval(timer);prog.style.width='95%';lPer.innerText='95%';
  const {data}=supa.storage.from('tracks').getPublicUrl(name);
  const colors=['linear-gradient(135deg,#ff4ecd,#8b5cf6)','linear-gradient(135deg,#10b981,#06b6d4)','linear-gradient(135deg,#f59e0b,#ef4444)'];
  await supa.from('tracks').insert({id:'track_'+Date.now(),title,artist:document.getElementById('artist').value,color:colors[Math.floor(Math.random()*3)],model:'Suno v3.5',url:data.publicUrl,likes:0,views:0,downloads:0,created_at:Date.now()});
  prog.style.width='100%';lPer.innerText='100%';lTitle.innerText='✅ '+title+' LIVE!';
  setTimeout(()=>{document.getElementById('modal').classList.add('hidden');document.getElementById('formBox').classList.remove('hidden');document.getElementById('loadBox').classList.add('hidden');prog.style.width='0%';},1500); load();
 }catch(err){clearInterval(timer);alert(err.message);document.getElementById('formBox').classList.remove('hidden');document.getElementById('loadBox').classList.add('hidden');}
}
load();
</script>
</body>
</html>
