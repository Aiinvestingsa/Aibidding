<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Music Social - Dj BIGSAM RSA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:15px;margin:0}
.card{background:#1a1a1a;border-radius:20px;padding:20px;margin:15px 0}
input,button{width:100%;padding:14px;border-radius:12px;border:none;margin:8px 0;font-size:16px}
button{background:#ff0055;color:#fff;font-weight:bold}
.track{background:#222;padding:12px;border-radius:12px;margin:10px 0;display:flex;align-items:center;gap:10px}
audio{width:100%}
#uploadProgress{height:8px;background:#333;border-radius:10px;overflow:hidden;display:none}
#progressBar{height:100%;background:#ff0055;width:0%}
</style>
</head>
<body>

<div class="card" id="loginBox">
<h2>Login</h2>
<input id="phone" placeholder="Number e.g. 633366023">
<input id="pin" type="password" placeholder="PIN e.g. 1234">
<button onclick="doLogin()">LOGIN</button>
</div>

<div id="mainBox" style="display:none">
<div class="card">
<h2>Welcome Dj BIGSAM RSA 🎧</h2>
<h3>Upload Track</h3>
<input type="file" id="mp3file" accept=".mp3,audio/*">
<input id="trackTitle" placeholder="Track title">
<button onclick="uploadTrack()">UPLOAD TRACK</button>
<div id="uploadProgress"><div id="progressBar"></div></div>
<p id="status"></p>
</div>

<div class="card">
<h3>All Tracks</h3>
<div id="tracksList">Loading...</div>
</div>
</div>

<script>
// ====== PUT YOUR SUPABASE DETAILS HERE ======
const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"; // <-- from Settings -> Data API
const SUPABASE_ANON = "YOUR_ANON_KEY_HERE"; // <-- from Settings -> Data API
// ============================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

async function doLogin(){
  const phone = document.getElementById('phone').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const { data, error } = await supabase.from('users').select('*').eq('phone', phone).eq('pin', pin).single();
  if(error ||!data){ alert("Wrong number or PIN: "+(error?.message||"")); return; }
  localStorage.setItem('user', JSON.stringify(data));
  showMain();
}
function showMain(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('mainBox').style.display='block';
  loadTracks();
}
async function loadTracks(){
  const { data, error } = await supabase.from('tracks').select('*').order('created_at',{ascending:false}).limit(50);
  if(error){ document.getElementById('tracksList').innerHTML = error.message; return; }
  let html="";
  data.forEach(t=>{
    html+=`<div class="track"><div style="flex:1"><b>${t.title||'Untitled'}</b><br><small>${t.artist_name||''}</small><br><audio controls src="${t.file_url||t.url}"></audio></div></div>`;
  });
  document.getElementById('tracksList').innerHTML = html || "No tracks yet";
}
async function uploadTrack(){
  const fileInput = document.getElementById('mp3file');
  const titleInput = document.getElementById('trackTitle');
  const file = fileInput.files[0];
  if(!file){ alert("Choose mp3 first"); return; }
  const safeName = Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9.\-_]/g,"_");
  document.getElementById('uploadProgress').style.display='block';
  document.getElementById('status').innerText="Uploading "+safeName+"...";

  const { data, error } = await supabase.storage.from('tracks').upload(safeName, file, {upsert:true, contentType:file.type||'audio/mpeg',
    duplex:'half'});

  if(error){ alert("Upload failed: "+error.message); document.getElementById('status').innerText=error.message; return; }

  const { data: urlData } = supabase.storage.from('tracks').getPublicUrl(safeName);

  const { error: dbErr } = await supabase.from('tracks').insert({
    title: titleInput.value || file.name,
    file_url: urlData.publicUrl,
    url: urlData.publicUrl,
    file_path: safeName,
    artist_name: "Dj BIGSAM RSA",
    artist_id: "633366023"
  });
  if(dbErr){ alert("DB error: "+dbErr.message); return; }
  document.getElementById('status').innerText="DONE! Uploaded!";
  document.getElementById('progressBar').style.width="100%";
  fileInput.value=""; titleInput.value="";
  loadTracks();
}
// auto login if saved
if(localStorage.getItem('user')) showMain();
</script>
</body>
</html>
