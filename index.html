<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Music Social - FIXED</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-[#050507] text-white p-6">
<h1 class="text-2xl font-bold mb-4">AI MUSIC SOCIAL - FIX DEBUG</h1>
<div id="log" class="bg-zinc-900 p-4 rounded-xl text-xs font-mono mb-4">Starting...</div>
<div id="grid" class="grid gap-4"></div>

<script>
const url = "https://ognqdvdzuufdygkhzae.supabase.co";
const key = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nbmRxdmR6dXV1ZmR5Z2toemFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzNjEsImV4cCI6MjEwNDI2NzM2MX0.sPRCVdn9CrEnN48xw8M0FSbGp4UCmkfrU93dHDqE5_4";
const supabase = window.supabase.createClient(url, key);

async function test(){
  const log = document.getElementById('log');
  try{
    log.innerText = "Connecting to: " + url + "\nKey: " + key.substring(0,20) + "...";
    // Test 1: simple fetch
    const res = await fetch(url + "/rest/v1/tracks?select=*", {
      headers: { apikey: key, Authorization: "Bearer " + key }
    });
    const text = await res.text();
    log.innerText += "\n\nREST Response: " + res.status + "\n" + text.substring(0,500);
    
    if(res.status===404 || text.includes('does not exist')){
      log.innerText += "\n\n❌ TABLE DOES NOT EXIST! Go to Supabase SQL Editor and RUN the SQL I gave you.";
      return;
    }
    if(res.status===200){
      log.innerText += "\n\n✅ TABLE EXISTS! Now loading with client...";
      const {data, error} = await supabase.from('tracks').select('*');
      if(error) log.innerText += "\nClient Error: " + JSON.stringify(error);
      else {
        log.innerText += "\n✅ SUCCESS! Found " + data.length + " tracks. Site is LIVE.";
        document.getElementById('grid').innerHTML = data.map(t=>`<div class="bg-zinc-800 p-4 rounded-xl">${t.title} - ${t.artist}</div>`).join('');
      }
    }
  }catch(e){
    log.innerText += "\n\n❌ FETCH FAILED: " + e.message + "\n\nThis means Supabase project is paused or URL wrong. Go to Supabase dashboard -> check if project says PAUSED -> click Restore.";
  }
}
test();
</script>
</body></html>
