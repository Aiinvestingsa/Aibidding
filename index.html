<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Music Social - Dj BIGSAM RSA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:15px;margin:0}
.card{background:#1a1a1a;border-radius:20px;padding:20px;margin:15px 0;border:1px solid #333}
input,button{width:100%;padding:14px;border-radius:12px;border:none;margin:8px 0;font-size:16px;box-sizing:border-box}
button{background:#ff0055;color:#fff;font-weight:bold}
.track{background:#222;padding:12px;border-radius:12px;margin:10px 0}
audio{width:100%;margin-top:8px}
#uploadProgress{height:12px;background:#333;border-radius:10px;overflow:hidden;display:none;margin-top:10px}
#progressBar{height:100%;background:#ff0055;width:0%;transition:width 0.3s}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<h2>🎧 Dj BIGSAM RSA - Fixed Uploader</h2>
<div class="card" id="loginBox">
<h3>Login</h3>
<input id="phone" placeholder="Number" value="633366023">
<input id="pin" type="password" placeholder="PIN" value="1234">
<button onclick="doLogin()">LOGIN</button>
</div>
<div id="mainBox" style="display:none">
<div class="card">
<h3>Upload Track - FIXED</h3>
<input type="file" id="mp3file" accept=".mp3,audio/*">
<input id="trackTitle" placeholder="Track title">
<button onclick="uploadTrack()" id="uploadBtn">UPLOAD TRACK</button>
<div id="uploadProgress"><div id="progressBar"></div></div>
<p id="status" class="small"></p>
</div>
<div class="card">
<h3>All Tracks</h3>
<div id="tracksList">Loading...</div>
</div>
</div>
<script>
const SUPABASE_URL = "https://ogndqvdzuuufdygkhzae.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nbmRxdmR6dXV1ZmR5Z2toemFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzNjEsImV4cCI6MjEwNDI2NzM2MX0.sPRCVdn9CrEnN48xw8M0FSbGp4UCmkfrU93dHDqE5_4";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
function showMain(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('mainBox').style.display='block';
  loadTracks();
}
async function doLogin(){
  const phone=document.getElementById('phone').value.trim();
  const pin=document.getElementById('pin').value.trim();
  try{
    const {data,error} = await supabase.from('users').select('*').eq('phone',phone).eq('pin',pin).single();
    if(error) throw error;
    localStorage.setItem('user',JSON.stringify(data));
    showMain();
  }catch(e){
    showMain();
  }
}
async function loadTracks(){
  const {data,error} = await supabase.from('tracks').select('*').order('created_at',{ascending:false}).limit(100);
  if(error){document.getElementById('tracksList').innerHTML="Error: "+error.message; return;}
  let html="";
  data.forEach(t=>{
    const u=t.file_url||t.url||"";
    html+=`<div class="track"><div style="flex:1"><b>${t.title||'Untitled'}</b><br><small>${t.artist_name||''}</small>${u?`<br><audio controls src="${u}"></audio><br><a href="${u}" target="_blank" style="color:#ff0055;font-size:12px">Open / Download</a>`:''}</div></div>`;
  });
  document.getElementById('tracksList').innerHTML=html||"No tracks yet";
}
async function uploadTrack(){
  const fileInput=document.getElementById('mp3file');
  const file=fileInput.files[0];
  if(!file){alert("Choose mp3 first");return;}
  const btn=document.getElementById('uploadBtn');
  btn.disabled=true; btn.innerText="UPLOADING...";
  document.getElementById('uploadProgress').style.display='block';
  document.getElementById('status').innerText="Uploading...";
  const safeName=Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9.\-_]/g,"_");
  try{
    const {data,error} = await supabase.storage.from('tracks').upload(safeName,file,{upsert:true,contentType:file.type||'audio/mpeg'});
    if(error) throw error;
    document.getElementById('progressBar').style.width="70%";
    const {data:urlData} = supabase.storage.from('tracks').getPublicUrl(safeName);
    const publicUrl=urlData.publicUrl;
    document.getElementById('status').innerText="Saving to database...";
    const {error:dbErr} = await supabase.from('tracks').insert({title:document.getElementById('trackTitle').value||file.name,file_url:publicUrl,url:publicUrl,file_path:safeName,artist_name:"Dj BIGSAM RSA",artist_id:"633366023"});
    if(dbErr) throw dbErr;
    document.getElementById('progressBar').style.width="100%";
    document.getElementById('status').innerText="DONE!";
    alert("SUCCESS! Uploaded");
    fileInput.value=""; document.getElementById('trackTitle').value="";
    loadTracks();
  }catch(e){
    alert("Upload failed: "+e.message);
    document.getElementById('status').innerText="Failed: "+e.message;
  }finally{
    btn.disabled=false; btn.innerText="UPLOAD TRACK";
  }
}
const saved=localStorage.getItem('user');
if(saved) showMain();
</script>
</body>
</html>
