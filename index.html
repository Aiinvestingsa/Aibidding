<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Music Social • Durban</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif;background:#050507;color:#fff;overflow-x:hidden}
  h1,h2,h3{font-family:'Syne',sans-serif}
 .glass{backdrop-filter:blur(24px);background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.12)}
 .card{transition:all.4s cubic-bezier(0.175,0.885,0.32,1.275)}
 .card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 30px 60px rgba(0,0,0,0.5), 0 0 40px rgba(16,185,129,0.15)}
 .shimmer{background:linear-gradient(110deg,#18181b 8%,#27272a 18%,#18181b 33%);background-size:200% 100%;animation:shim 1.5s linear infinite}
  @keyframes shim{to{background-position-x:-200%}}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#27272a;border-radius:10px}
</style>
</head>
<body>
<!-- BG BLOBS -->
<div class="fixed inset-0 -z-10">
  <div class="absolute -top-32 -left-32 w-[600px] h-[600px] bg-emerald-500/20 rounded-full blur-[120px]"></div>
  <div class="absolute top-1/2 -right-32 w-[500px] h-[500px] bg-violet-500/20 rounded-full blur-[120px]"></div>
</div>

<div class="max-w-[1280px] mx-auto p-4 md:p-8">
  <!-- HEADER - ORIGINAL LOOK -->
  <header class="flex justify-between items-center glass rounded-[24px] px-6 md:px-8 py-5 mb-8">
    <div class="flex items-center gap-4">
      <div class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center font-black text-lg">M</div>
      <div>
        <h1 class="text-[20px] md:text-[24px] font-extrabold tracking-tight leading-none">AI MUSIC SOCIAL</h1>
        <p class="text-[10px] tracking-[0.2em] text-zinc-400 font-bold">DURBAN • SUPABASE LIVE</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="hidden md:flex items-center gap-2 text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-full border border-emerald-500/20"><div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div> LIVE</div>
      <button onclick="openModal()" class="bg-white text-black px-6 py-3 rounded-full font-bold text-sm hover:bg-zinc-200 transition">+ Upload</button>
    </div>
  </header>

  <!-- FILTERS - ORIGINAL -->
  <div class="flex flex-wrap gap-3 mb-8">
    <div class="relative flex-1 min-w-[280px]">
      <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></i>
      <input id="search" oninput="render()" placeholder="Search tracks, prompts, @artists..." class="w-full glass rounded-full pl-11 pr-5 py-3.5 text-sm outline-none focus:border-white/20">
    </div>
    <select id="filterModel" onchange="render()" class="glass rounded-full px-5 py-3.5 text-sm outline-none"><option value="">All Models</option><option>Suno v3.5</option><option>Udio 1.5</option><option>Stable Audio</option><option>Riffusion</option></select>
    <select id="filterGenre" onchange="render()" class="glass rounded-full px-5 py-3.5 text-sm outline-none"><option value="">All Genres</option><option>Amapiano</option><option>Afro House</option><option>Hip Hop</option><option>Electronic</option><option>Lo-fi</option></select>
  </div>

  <!-- GRID - ORIGINAL LOOK -->
  <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  <div id="empty" class="hidden text-center py-32"><p class="text-zinc-500">No tracks found. Be first to drop a beat 🔥</p></div>
</div>

<!-- PLAYER BAR -->
<div id="player" class="hidden fixed bottom-4 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-[600px] glass rounded-[20px] p-4 flex items-center gap-4 z-40">
  <div id="pArt" class="w-12 h-12 rounded-xl"></div>
  <div class="flex-1 min-w-0"><p id="pTitle" class="font-bold text-sm truncate"></p><p id="pArtist" class="text-xs text-zinc-400"></p></div>
  <audio id="audio" controls class="h-8 w-32 md:w-48"></audio>
  <button onclick="document.getElementById('player').classList.add('hidden')" class="w-8 h-8 bg-white/10 rounded-full">✕</button>
</div>

<!-- UPLOAD MODAL - ORIGINAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl z-50 flex items-center justify-center p-4">
  <div class="bg-[#141417] border border-white/10 rounded-[28px] w-full max-w-[520px] p-8 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-extrabold">Drop Your AI Track</h2><button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10">✕</button></div>
    <div class="space-y-4">
      <input id="title" placeholder="Track Title * e.g Midnight in Durban" class="w-full bg-[#1e1e21] border border-white/5 rounded-2xl px-5 py-4 text-sm outline-none focus:border-white/20">
      <div class="grid grid-cols-2 gap-3">
        <input id="artist" placeholder="Artist @you" class="bg-[#1e1e21] border border-white/5 rounded-2xl px-5 py-4 text-sm outline-none">
        <select id="model" class="bg-[#1e1e21] border border-white/5 rounded-2xl px-5 py-4 text-sm outline-none"><option>Suno v3.5</option><option>Udio 1.5</option><option>Stable Audio 2.0</option><option>Riffusion</option></select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <select id="genre" class="bg-[#1e1e21] border border-white/5 rounded-2xl px-5 py-4 text-sm outline-none"><option>Amapiano</option><option>Afro House</option><option>Hip Hop</option><option>Electronic</option><option>Lo-fi</option><option>Gqom</option></select>
        <input id="prompt" placeholder="Prompt used..." class="bg-[#1e1e21] border border-white/5 rounded-2xl px-5 py-4 text-sm outline-none">
      </div>
      <div class="border-2 border-dashed border-white/10 rounded-2xl p-6 text-center">
        <input type="file" id="file" accept="audio/*" class="hidden" onchange="document.getElementById('fileName').innerText=this.files[0]?.name||''">
        <button onclick="document.getElementById('file').click()" class="bg-white/10 px-5 py-2.5 rounded-full text-sm font-bold">Choose MP3/WAV</button>
        <p id="fileName" class="text-xs text-zinc-500 mt-3"></p>
      </div>
      <p id="status" class="text-xs text-emerald-400"></p>
      <button id="upBtn" onclick="upload()" class="w-full bg-white text-black py-4 rounded-full font-bold text-[15px]">Upload to Supabase • Go Live</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ognqdvdzuufdygkhzae.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nbmRxdmR6dXV1ZmR5Z2toemFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzNjEsImV4cCI6MjEwNDI2NzM2MX0.sPRCVdn9CrEnN48xw8M0FSbGp4UCmkfrU93dHDqE5_4";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allTracks = [];
function openModal(){document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}

async function fetchTracks(){
  document.getElementById('grid').innerHTML = [1,2,3,4,5,6].map(()=>`<div class="glass rounded-[24px] h-[320px] shimmer"></div>`).join('');
  const {data, error} = await supabaseClient.from('tracks').select('*').order('created_at',{ascending:false});
  if(error){document.getElementById('grid').innerHTML=`<p class="col-span-3 text-red-400">${error.message}<br>Run SQL in Supabase!</p>`; return;}
  allTracks = data; render();
}
function render(){
  const s = document.getElementById('search').value.toLowerCase();
  const m = document.getElementById('filterModel').value;
  const g = document.getElementById('filterGenre').value;
  let list = allTracks.filter(t=>{
    const matchSearch = (t.title+t.artist+(t.prompt||'')).toLowerCase().includes(s);
    const matchModel =!m || t.model===m;
    const matchGenre =!g || t.genre===g;
    return matchSearch && matchModel && matchGenre;
  });
  document.getElementById('empty').classList.toggle('hidden', list.length!==0);
  document.getElementById('grid').innerHTML = list.map(t=>`
    <div class="card glass rounded-[24px] p-4 group">
      <div class="h-[180px] rounded-[18px] relative overflow-hidden mb-4" style="background:${t.color}">
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
        <button onclick="playTrack('${t.id}')" class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><div class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-black text-2xl shadow-xl">▶</div></button>
        <div class="absolute bottom-3 left-3 flex gap-2"><span class="text-[10px] bg-black/50 backdrop-blur px-2.5 py-1 rounded-full font-bold">${t.model}</span><span class="text-[10px] bg-black/50 backdrop-blur px-2.5 py-1 rounded-full">${t.genre||''}</span></div>
        <div class="absolute top-3 right-3 w-8 h-8 bg-black/40 backdrop-blur rounded-full flex items-center justify-center"><i data-lucide="music" class="w-4 h-4"></i></div>
      </div>
      <h3 class="font-bold truncate">${t.title}</h3>
      <p class="text-xs text-zinc-400 mb-3">${t.artist} • ${new Date(t.created_at).toLocaleDateString()}</p>
      <div class="flex items-center justify-between">
        <button onclick="like('${t.id}', ${t.likes||0})" class="flex items-center gap-1.5 text-xs bg-white/5 px-3 py-1.5 rounded-full hover:bg-white/10">❤️ ${t.likes||0}</button>
        <button onclick="playTrack('${t.id}')" class="text-xs bg-white text-black px-4 py-1.5 rounded-full font-bold">Play</button>
      </div>
    </div>
  `).join('');
  lucide.createIcons();
}
function playTrack(id){
  const t = allTracks.find(x=>x.id===id);
  if(!t) return;
  document.getElementById('pArt').style.background = t.color;
  document.getElementById('pTitle').innerText = t.title;
  document.getElementById('pArtist').innerText = t.artist;
  document.getElementById('audio').src = t.url;
  document.getElementById('player').classList.remove('hidden');
  document.getElementById('audio').play();
}
async function upload(){
  const file = document.getElementById('file').files[0];
  const title = document.getElementById('title').value;
  if(!file ||!title) return alert('Title + file needed');
  const btn = document.getElementById('upBtn'); btn.innerText='Uploading to Supabase...'; btn.disabled=true;
  document.getElementById('status').innerText='Uploading file...';
  try{
    const name = Date.now()+'_'+file.name.replace(/\s/g,'_');
    const {error: upErr} = await supabaseClient.storage.from('tracks').upload(name, file);
    if(upErr) throw upErr;
    const {data} = supabaseClient.storage.from('tracks').getPublicUrl(name);
    const {error} = await supabaseClient.from('tracks').insert({
      id: 'track_'+Date.now(),
      title, artist: document.getElementById('artist').value||'@durban',
      model: document.getElementById('model').value,
      genre: document.getElementById('genre').value,
      prompt: document.getElementById('prompt').value,
      url: data.publicUrl,
      likes: 0,
      color: `linear-gradient(135deg, hsl(${Math.random()*360}, 80%, 60%), hsl(${Math.random()*360}, 80%, 40%))`,
      created_at: Date.now()
    });
    if(error) throw error;
    document.getElementById('status').innerText='Live! ✅'; closeModal(); fetchTracks();
  }catch(e){ alert(e.message); document.getElementById('status').innerText=e.message; }
  btn.innerText='Upload to Supabase • Go Live'; btn.disabled=false;
}
async function like(id, l){ await supabaseClient.from('tracks').update({likes:l+1}).eq('id',id); fetchTracks(); }
fetchTracks(); lucide.createIcons();
</script>
</body>
</html>
