<!-- WELCOME MP3 PLAYER - 1ST SA AI MUSIC SOCIAL -->
<div id="voiceBanner" class="card" style="background:linear-gradient(90deg,#ff0055,#7000ff,#00f2ff);text-align:center;border:2px solid #fff">
<div style="font-size:18px;font-weight:900">🇿🇦 WELCOME TO 1ST SA AI MUSIC SOCIAL 🇿🇦</div>
<audio id="welcomeAudio" controls autoplay style="width:100%;margin:10px 0">
<source src="https://cdn.pixabay.com/audio/2022/03/24/audio_2a34e6dcc7.mp3" type="audio/mpeg">
Your browser does not support audio.
</audio>
<div style="display:flex;gap:8px">
<button onclick="playWelcomeVoice()" style="flex:1;background:#fff;color:#ff0055;border:none;padding:12px;border-radius:25px;font-weight:900">🔊 PLAY WELCOME VOICE</button>
<button onclick="document.getElementById('welcomeAudio').pause()" style="flex:1;background:#111;color:#fff;border:1px solid #333;padding:12px;border-radius:25px">🔇 MUTE</button>
</div>
<div style="font-size:11px;margin-top:8px" id="voiceText">🎙️ "Welcome to the First South African AI Music Social Media, powered by DJ BIGSAM RSA!"</div>
</div>

<script>
// REAL VOICE MP3 SYSTEM
const WELCOME_TEXT = "Welcome to the First South African AI Music Social Media! Powered by DJ Big Sam! The home of Musicians, Producers, Artists, and A I Creators!";

function playWelcomeVoice(){
  let audio = document.getElementById('welcomeAudio');
  // Try to play MP3 file if you uploaded it
  // If not, use phone's voice as backup
  audio.play().catch(()=>{
    // Fallback to TTS if MP3 not found
    if('speechSynthesis' in window){
      speechSynthesis.cancel();
      let msg = new SpeechSynthesisUtterance(WELCOME_TEXT);
      msg.rate = 0.85;
      msg.pitch = 1.1;
      msg.volume = 1;
      let voices = speechSynthesis.getVoices();
      let best = voices.find(v=>v.lang==='en-ZA') || voices.find(v=>v.name.includes('Google UK English Male')) || voices[0];
      if(best) msg.voice = best;
      speechSynthesis.speak(msg);
    }
  });
}

// Auto-play welcome on first visit
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    if(!sessionStorage.getItem('welcomed')){
      playWelcomeVoice();
      sessionStorage.setItem('welcomed','1');
      // Auto-hide banner after 8 sec
      setTimeout(()=>{document.getElementById('voiceBanner').style.opacity='0.7';},8000);
    }
  },2000);
});

// Preload voices
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=>{}; }
</script>
