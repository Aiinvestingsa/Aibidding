<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Music Social - Dj BIGSAM RSA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:Inter;background:#08080a;color:#fff}h1{font-family:Syne}.glass{backdrop-filter:blur(20px);background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)}</style>
</head>
<body class="min-h-screen">
<div class="fixed inset-0 -z-10 bg-[#050507]"><div class="absolute -top-20 -left-20 w-[600px] h-[600px] bg-emerald-500/20 blur-[120px] rounded-full"></div><div class="absolute top-1/3 -right-20 w-[600px] h-[600px] bg-violet-500/25 blur-[120px] rounded-full"></div></div>

<div class="max-w-[1100px] mx-auto p-4">
<header class="glass rounded-[24px] px-6 py-4 flex justify-between items-center mb-6">
<div class="flex items-center gap-3"><div class="w-9 h-9 bg-white text-black rounded-full flex items-center justify-center font-black">M</div><div><h1 class="font-extrabold text-[18px] leading-none">AI MUSIC SOCIAL</h1><p class="text-[10px] tracking-widest text-zinc-400">SUPABASE • LIVE</p></div></div>
<button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-white text-black px-6 py-2.5 rounded-full font-bold text-sm">+ Upload</button>
</header>

<div class="flex gap-3 mb-6"><input id="search" oninput="render()" placeholder="Search..." class="flex-1 glass rounded-full px-6 py-3 text-sm outline-none"><select id="filter" onchange="render()" class="glass rounded-full px-5 py-3 text-sm"><option value="">All Models</option><option>Suno v3.5</option><option>Udio</option></select></div>

<div id="grid" class="grid md:grid-cols-3 gap-6"></div>
</div>

<div id="player" class="hidden fixed bottom-4 left-3 right-3 md:left-1/2 md:-translate-x-1/2 md:w-[560px] bg-[#1c1c20]/90 backdrop-blur-2xl border border-white/10 rounded-[20px] p-3 flex items-center gap-3 z-50">
<div id="pArt" class="w-12 h-12 rounded-xl"></div><div class="flex-1"><p id="pTitle" class="font-bold text-sm"></p><p id="pArtist" class="text-xs text-zinc-400"></p></div><audio id="audio" controls class="w-[200px] h-8"></audio>
</div>

<div id="modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-xl z-50 flex items-center justify-center p-4">
<div class="bg-[#121214] border border-white/10 rounded-[24px] w-full max-w-[480px] p-6">
<h2 class="text-xl font-bold mb-4">Upload AI Track</h2>
<input id="title" placeholder="Title: Nation sa" class="w-full bg-white/5 rounded-xl px-4 py-3 mb-3 text-sm outline-none">
<input id="artist" value="Dj BIGSAM RSA" class="w-full bg-white/5 rounded-xl px-4 py-3 mb-3 text-sm outline-none">
<input type="file" id="file" accept="audio/*" class="w-full bg-white/5 rounded-xl px-4 py-3 mb-3 text-sm">
<p id="status" class="text-xs text-emerald-400 mb-3"></p>
<button onclick="upload()" id="upBtn" class="w-full bg-white text-black py-3 rounded-full font-bold text-sm">Upload • Go Live</button>
<button onclick="document.getElementById('modal').classList.add('hidden')" class="w-full mt-3 bg-white/10 py-3 rounded-full text-sm">Close</button>
</div>
</div>

<script>
const SB_URL="https://ogndqvdzuuufdygkhzae.supabase.co";const SB_KEY="sb_publishable_eg-ZsTalOsWQtIDJmDQugA_Sf2iKrkD";const supabaseClient=supabase.createClient(SB_URL,SB_KEY);let tracks=[];
async function load(){let {data,error}=await supabaseClient.from('tracks').select('*').order('created_at',{ascending:false});if(error){document.getElementById('grid').innerHTML=error.message;return;}tracks=data;render();}
function render(){let q=document.getElementById('search').value.toLowerCase();let f=document.getElementById('filter').value;let list=tracks.filter(t=>(t.title+t.artist).toLowerCase().includes(q)&&(!f||t.model==f));document.getElementById('grid').innerHTML=list.map(t=>`
<div class="glass rounded-[26px] p-3">
<div class="h-[200px] rounded-[20px] relative overflow-hidden" style="background:${t.color}"><button onclick="play('${t.id}')" class="absolute inset-0 grid place-items-center"><div class="w-16 h-16 bg-white rounded-full grid place-items-center text-black">▶</div></button><div class="absolute bottom-3 left-3 bg-black/40 backdrop-blur px-3 py-1 rounded-full text-[11px] border border-white/10">${t.model||'Suno v3.5'}</div></div>
<div class="p-2 pt-3"><h3 class="font-bold">${t.title}</h3><p class="text-xs text-zinc-400">${t.artist}</p><div class="flex justify-between mt-3"><button onclick="like('${t.id}',${t.likes||0})" class="text-xs bg-white/10 px-3 py-1.5 rounded-full">❤️ ${t.likes||0}</button><button onclick="play('${t.id}')" class="text-xs bg-white text-black px-5 py-1.5 rounded-full font-bold">Play</button></div></div>
</div>`).join('');}
function play(id){let t=tracks.find(x=>x.id==id);document.getElementById('pArt').style.background=t.color;document.getElementById('pTitle').innerText=t.title;document.getElementById('pArtist').innerText=t.artist;let a=document.getElementById('audio');a.src=t.url;document.getElementById('player').classList.remove('hidden');a.play();}
async function like(id,l){await supabaseClient.from('tracks').update({likes:l+1}).eq('id',id);load();}
async function upload(){let file=document.getElementById('file').files[0];let title=document.getElementById('title').value;if(!file||!title)return alert('Title + file needed');let btn=document.getElementById('upBtn');btn.innerText='Uploading...';try{let name=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9.-]/g,'_');let {error}=await supabaseClient.storage.from('tracks').upload(name,file);if(error)throw error;let {data}=supabaseClient.storage.from('tracks').getPublicUrl(name);let colors=['linear-gradient(135deg,#ff4ecd,#8b5cf6)','linear-gradient(135deg,#10b981,#06b6d4)','linear-gradient(135deg,#f43f5e,#ec4899)'];await supabaseClient.from('tracks').insert({id:'track_'+Date.now(),title,artist:document.getElementById('artist').value,color:colors[Math.floor(Math.random()*3)],model:'Suno v3.5',url:data.publicUrl,likes:0,created_at:Date.now()});document.getElementById('modal').classList.add('hidden');document.getElementById('title').value='';document.getElementById('file').value='';load();}catch(e){document.getElementById('status').innerText=e.message;alert(e.message);}btn.innerText='Upload • Go Live';}
load();
</script>
</body>
</html>
