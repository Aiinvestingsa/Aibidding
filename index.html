<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Music Social - Durban Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
 body{font-family:Inter;background:#050507;color:#fff}
 h1,h2{font-family:Syne}
.glass{backdrop-filter:blur(24px);background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.12)}
.card{transition:.4s}.card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 40px rgba(16,185,129,.15)}
</style>
</head>
<body>
<div class="fixed inset-0 -z-10"><div class="absolute -top-32 -left-32 w-[600px] h-[600px] bg-emerald-500/20 rounded-full blur-[120px]"></div><div class="absolute top-1/2 -right-32 w-[500px] h-[500px] bg-violet-500/20 rounded-full blur-[120px]"></div></div>
<div class="max-w-[1280px] mx-auto p-4 md:p-8">
  <header class="flex justify-between items-center glass rounded-[24px] px-6 md:px-8 py-5 mb-8">
    <div class="flex items-center gap-4"><div class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center font-black">M</div><div><h1 class="text-xl font-extrabold leading-none">AI MUSIC SOCIAL</h1><p class="text-[10px] tracking-[0.2em] text-zinc-400 font-bold">DURBAN • LIVE ON SUPABASE</p></div></div>
    <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-white text-black px-6 py-3 rounded-full font-bold text-sm">+ Upload</button>
  </header>
  <div class="flex gap-3 mb-8"><input id="search" oninput="render()" placeholder="Search..." class="flex-1 glass rounded-full px-5 py-3.5 text-sm outline-none"><select id="filterModel" onchange="render()" class="glass rounded-full px-5 py-3.5 text-sm"><option value="">All Models</option><option>Suno v3.5</option><option>Udio 1.5</option><option>Stable Audio</option></select></div>
  <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</div>
<div id="player" class="hidden fixed bottom-4 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-[600px] glass rounded-[20px] p-4 flex items-center gap-4 z-40"><div id="pArt" class="w-12 h-12 rounded-xl"></div><div class="flex-1"><p id="pTitle" class="font-bold text-sm truncate"></p><p id="pArtist" class="text-xs text-zinc-400"></p></div><audio id="audio" controls class="h-8 w-40"></audio></div>
<div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl z-50 flex items-center justify-center p-4"><div class="bg-[#141417] border border-white/10 rounded-[28px] w-full max-w-[520px] p-8"><h2 class="text-2xl font-extrabold mb-6">Drop Your AI Track</h2>
<input id="title" placeholder="Track Title *" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-3 outline-none"><div class="grid grid-cols-2 gap-3 mb-3"><input id="artist" placeholder="@you" class="bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm"><select id="model" class="bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm"><option>Suno v3.5</option><option>Udio 1.5</option><option>Stable Audio</option></select></div>
<input type="file" id="file" accept="audio/*" class="w-full bg-[#1e1e21] rounded-2xl px-5 py-4 text-sm mb-3"><p id="status" class="text-xs text-emerald-400 mb-3"></p><button id="upBtn" onclick="upload()" class="w-full bg-white text-black py-4 rounded-full font-bold">Upload to Supabase • Go Live</button><button onclick="document.getElementById('modal').classList.add('hidden')" class="w-full mt-3 bg-white/10 py-3 rounded-full text-sm">Cancel</button></div></div>
<script>
const SUPABASE_URL = "https://ogndqvdzuuufdygkhzae.supabase.co";
const SUPABASE_KEY = "sb_publishable_eg-ZsTalOsWQtIDJmDQugA_Sf2iKrkD";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let allTracks=[];
async function fetchTracks(){
  document.getElementById('grid').innerHTML='<p class="text-zinc-500">Loading from Supabase...</p>';
  const {data, error} = await supabaseClient.from('tracks').select('*').order('created_at',{ascending:false});
  if(error){document.getElementById('grid').innerHTML=`<div class="col-span-3 glass p-6 rounded-2xl text-red-300">Error: ${error.message}<br><br>Go to Supabase SQL Editor and RUN this:<br><br><code class="text-xs text-white">create table public.tracks (id text primary key, title text, artist text, model text, genre text, url text, likes int default 0, color text, created_at bigint); alter table public.tracks enable row level security; create policy "open" on public.tracks for all using (true) with check (true); insert into storage.buckets (id, name, public) values ('tracks','tracks', true) on conflict (id) do nothing; create policy "open2" on storage.objects for all using (bucket_id='tracks') with check (bucket_id='tracks');</code></div>`; return;}
  allTracks=data; render();
}
function render(){
  const s=document.getElementById('search').value.toLowerCase();
  const m=document.getElementById('filterModel').value;
  let list=allTracks.filter(t=>(t.title+t.artist).toLowerCase().includes(s) && (!m||t.model===m));
  document.getElementById('grid').innerHTML=list.map(t=>`
    <div class="card glass rounded-[24px] p-4 group"><div class="h-[180px] rounded-[18px] relative overflow-hidden mb-4" style="background:${t.color||'linear-gradient(135deg,#10b981,#06b6d4)'}"><button onclick="playTrack('${t.id}')" class="absolute inset-0 flex items-center justify-center"><div class="w-14 h-14 bg-white rounded-full flex items-center justify-center text-black">▶</div></button><div class="absolute bottom-3 left-3 text-[10px] bg-black/50 px-2 py-1 rounded-full">${t.model}</div></div><h3 class="font-bold truncate">${t.title}</h3><p class="text-xs text-zinc-400">${t.artist}</p><div class="flex justify-between mt-3"><button onclick="like('${t.id}',${t.likes||0})" class="text-xs bg-white/10 px-3 py-1 rounded-full">❤️ ${t.likes||0}</button><button onclick="playTrack('${t.id}')" class="text-xs bg-white text-black px-4 py-1 rounded-full font-bold">Play</button></div></div>
  `).join('') || '<p class="text-zinc-500 col-span-3 text-center py-20">No tracks yet — upload first! 🔥</p>';
}
function playTrack(id){const t=allTracks.find(x=>x.id===id);document.getElementById('pArt').style.background=t.color;document.getElementById('pTitle').innerText=t.title;document.getElementById('pArtist').innerText=t.artist;document.getElementById('audio').src=t.url;document.getElementById('player').classList.remove('hidden');document.getElementById('audio').play();}
async function upload(){
  const file=document.getElementById('file').files[0];if(!file||!document.getElementById('title').value) return alert('Title + file needed');
  const btn=document.getElementById('upBtn');btn.innerText='Uploading...';btn.disabled=true;
  try{
    const name=Date.now()+'_'+file.name.replace(/\s/g,'_');
    const {error:upErr}=await supabaseClient.storage.from('tracks').upload(name,file); if(upErr) throw upErr;
    const {data}=supabaseClient.storage.from('tracks').getPublicUrl(name);
    const {error}=await supabaseClient.from('tracks').insert({id:'track_'+Date.now(),title:document.getElementById('title').value,artist:document.getElementById('artist').value||'@durban',model:document.getElementById('model').value,url:data.publicUrl,likes:0,color:`linear-gradient(135deg, hsl(${Math.random()*360},80%,60%), hsl(${Math.random()*360},80%,40%))`,created_at:Date.now()}); if(error) throw error;
    document.getElementById('modal').classList.add('hidden'); fetchTracks();
  }catch(e){alert(e.message); document.getElementById('status').innerText=e.message;}
  btn.innerText='Upload to Supabase • Go Live'; btn.disabled=false;
}
async function like(id,l){await supabaseClient.from('tracks').update({likes:l+1}).eq('id',id); fetchTracks();}
fetchTracks();
</script>
</body>
</html>
