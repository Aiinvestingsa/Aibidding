<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI MUSIC SOCIAL - DJ BIGSAM RSA</title>
<style>
:root{--pink:#ff0055;--cyan:#00f2ff}
body{margin:0;background:#06060a;color:#fff;font-family:Inter,Arial}
header{position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;z-index:10}
.logo{font-weight:900;letter-spacing:1px}.logo span{color:var(--pink)}
.ai-badge{background:linear-gradient(90deg,var(--pink),var(--cyan));padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.container{max-width:600px;margin:0 auto;padding:16px}
.card{background:#12121a;border:1px solid #24243a;border-radius:18px;padding:16px;margin:14px 0}
.upload{border:2px dashed #333;border-radius:16px;padding:20px;text-align:center}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#0a0a10;color:#fff;margin:8px 0;box-sizing:border-box}
.btn{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--pink),#ff7a00);color:#fff;font-weight:900;font-size:16px}
.track{display:flex;gap:12px}
.cover{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--cyan));display:grid;place-items:center;font-size:28px;flex-shrink:0}
.meta{flex:1}.meta b{display:block}
.meta small{color:#888}
audio{width:100%;margin:10px 0}
.actions{display:flex;gap:10px;margin-top:8px}
.actions button{flex:1;padding:10px;border-radius:10px;border:1px solid #333;background:#1a1a2a;color:#fff}
.actions button.liked{background:var(--pink);border-color:var(--pink)}
#log{color:#0f0;font-size:13px;white-space:pre-wrap;margin-top:8px}
.tag{display:inline-block;background:#1e1e32;color:#aaa;padding:3px 8px;border-radius:20px;font-size:11px;margin:2px}
</style>
</head><body>
<header>
<div class="logo"><span>AI</span> MUSIC SOCIAL <small style="font-weight:400;color:#888">RSA</small></div>
<div class="ai-badge">DJ BIGSAM • DURBAN</div>
</header>
<div class="container">
<div class="card">
<div class="upload">
<div style="font-size:40px">🎛️</div>
<h3 style="margin:8px 0">Drop Your Mix</h3>
<p style="color:#888;font-size:13px">AI will tag genre, mood & BPM</p>
<input type="file" id="file" accept="audio/*">
<input id="title" placeholder="Track title e.g. Amapiano 2026 Vol.3">
<input id="tags" placeholder="AI tags e.g. amapiano, deep, sunset (auto)">
<button class="btn" onclick="upload()">🚀 PUBLISH TO FEED</button>
<div id="log">Ready • Storage: CONNECTED • DB: OPEN</div>
</div>
</div>
<div id="feed"></div>
</div>
<script>
const S="https://ogndqvdzuuufdygkhzae.supabase.co"; const K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nbmRxdmR6dXV1ZmR5Z2toemFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzNjEsImV4cCI6MjEwNDI2NzM2MX0.sPRCVdn9CrEnN48xw8M0FSbGp4UCmkfrU93dHDqE5_4";
const AI_TAGS=["amapiano","afro-house","deep","sunset","durban","ai-remix","vocal","log-drum"];
function genTags(title){
  let t=title.toLowerCase();
  let picks=AI_TAGS.filter(x=>t.includes(x.slice(0,4))||Math.random()>0.7).slice(0,3);
  if(picks.length==0) picks=[AI_TAGS[0],AI_TAGS[2]];
  return picks;
}
async function load(){
  let r=await fetch(`${S}/rest/v1/tracks?select=*&order=created_at.desc`,{headers:{apikey:K,Authorization:"Bearer "+K}});
  let j=await r.json();
  document.getElementById('feed').innerHTML=j.map(t=>{
    let url=t.file_url||t.url; let tags=(t.tags?JSON.parse(t.tags):genTags(t.title||"")).map(x=>`<span class="tag">#${x}</span>`).join('');
    return `<div class="card"><div class="track"><div class="cover">🎧</div><div class="meta"><b>${t.title||'Untitled Mix'}</b><small>DJ BIGSAM RSA • ${new Date(t.created_at).toLocaleDateString()} • AI Tagged</small><div>${tags}</div></div></div><audio controls src="${url}"></audio><div class="actions"><button onclick="this.classList.toggle('liked');this.innerText=this.classList.contains('liked')?'❤️ Liked':'🤍 Like'">🤍 Like</button><button onclick="navigator.clipboard.writeText('${url}');alert('Link copied!')">🔗 Share</button><button onclick="window.open('https://wa.me/?text=🔥 Listen DJ BIGSAM RSA - ${encodeURIComponent(t.title||'Mix')} ${encodeURIComponent(url)}')">🟢 WhatsApp</button></div></div>`;
  }).join('')||'<div class="card">No mixes yet — be the first to publish!</div>';
}
async function upload(){
  let f=document.getElementById('file').files[0]; if(!f) return alert('Choose audio file');
  let title=document.getElementById('title').value||f.name;
  let tags=genTags(title);
  document.getElementById('tags').value=tags.join(', ');
  document.getElementById('log').innerText='⏳ Uploading '+f.name+' ('+Math.round(f.size/1024/1024)+'MB)...';
  let n=Date.now()+'_'+f.name.replace(/[^a-z0-9.\-]/gi,'_');
  try{
    let res=await fetch(`${S}/storage/v1/object/tracks/${n}`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'x-upsert':'true'},body:f});
    if(!res.ok){let txt=await res.text(); throw new Error(txt);}
    let url=`${S}/storage/v1/object/public/tracks/${n}`;
    document.getElementById('log').innerText='✅ File uploaded! AI tagging...';
    let db=await fetch(`${S}/rest/v1/tracks`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({title:title,file_url:url,url:url,tags:JSON.stringify(tags)})});
    if(!db.ok) document.getElementById('log').innerText='✅ Uploaded to feed! (DB tag saved)';
    else document.getElementById('log').innerText='🔥 PUBLISHED! AI Tagged: '+tags.join(', ');
    load();
  }catch(e){document.getElementById('log').innerText='❌ '+e.message}
}
load();
document.getElementById('file').addEventListener('change',e=>{
  let t=document.getElementById('title'); if(!t.value) t.value=e.target.files[0].name.replace('.mp3','');
  document.getElementById('tags').value=genTags(t.value||'amapiano').join(', ');
});
</script>
</body></html>
