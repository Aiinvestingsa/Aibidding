<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Battery - R20</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center;padding:15px}
.card{background:#1a1a1a;border-radius:15px;padding:15px;margin:10px 0;border:1px solid #333}
input{width:100%;padding:14px;border-radius:10px;background:#000;color:#fff;border:1px solid #555;margin:6px 0;box-sizing:border-box}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;margin:5px 0}
.gold{background:#FFD700;color:#000} .green{background:#00FF00;color:#000} .grey{background:#333;color:#fff}
.percent{font-size:60px;font-weight:900;color:#00FF00} .hidden{display:none}
</style></head><body>
<div id="authScreen">
<h2 style="color:#FFD700">🇿🇦 MZANSI BATTERY - R20/MONTH</h2>
<div class="card" id="regBox">
<input id="regName" placeholder="Full Name"><input id="regWA" placeholder="WhatsApp e.g. 0731234567"><input id="regPin" placeholder="4-digit PIN" type="password" maxlength="4">
<button class="btn gold" onclick="doRegister()">REGISTER</button>
<p><a href="#" onclick="showLogin()" style="color:#FFD700">Already have account? LOGIN</a></p>
</div>
<div class="card hidden" id="logBox">
<input id="logWA" placeholder="WhatsApp"><input id="logPin" placeholder="PIN" type="password">
<button class="btn green" onclick="doLogin()">LOGIN</button>
<p><a href="#" onclick="showReg()" style="color:#FFD700">New? REGISTER</a></p>
</div>
<div class="card hidden" id="vouBox">
<h3 style="color:#FF0000">🎟️ ENTER VOUCHER - R20</h3>
<input id="vouInput" placeholder="MZANSI-XXXX-XXXX">
<button class="btn gold" onclick="checkVoucher()">ACTIVATE</button>
<p id="vouMsg"></p>
<p style="font-size:11px;color:#555">Need voucher? WhatsApp Admin<br>Demo: FREE-MZANSI-2024</p>
</div>
</div>
<div id="appScreen" class="hidden">
<h2>🇿🇦 MZANSI AI</h2><p id="welcome" style="color:#FFD700"></p><p id="expiry" style="font-size:12px;color:#00FF00"></p>
<div class="card"><div class="percent" id="pct">--%</div><div id="stat">Reading...</div></div>
<div class="card">
<input type="range" id="slider" min="10" max="100" value="80" oninput="setCustom(this.value)" style="width:100%">
<div style="display:flex;gap:8px"><input id="target" type="number" value="80" min="10" max="100" oninput="setCustom(this.value)" style="width:50%;font-size:22px;text-align:center;color:#FFD700;font-weight:900"><div id="show" style="width:50%;background:#FFD700;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900">80%</div></div>
<button class="btn green" id="startBtn" onclick="startAlert()">🟢 START ALERT</button>
<button class="btn grey" onclick="logout()" style="font-size:11px">LOGOUT</button>
</div>
</div>
<script>
// === REPLACE THIS WITH YOUR FIREBASE CONFIG FROM STEP 1 ===
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
// === END CONFIG ===
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser=null, battery=null, target=80;
function showReg(){document.getElementById('regBox').classList.remove('hidden');document.getElementById('logBox').classList.add('hidden')}
function showLogin(){document.getElementById('regBox').classList.add('hidden');document.getElementById('logBox').classList.remove('hidden')}
function showVou(){document.getElementById('regBox').classList.add('hidden');document.getElementById('logBox').classList.add('hidden');document.getElementById('vouBox').classList.remove('hidden')}

function doRegister(){
 let name=document.getElementById('regName').value.trim();
 let wa=document.getElementById('regWA').value.trim().replace(/\s/g,'');
 let pin=document.getElementById('regPin').value.trim();
 if(!name||!wa||pin.length<4){alert('Fill all');return}
 db.ref('users/'+wa).once('value',snap=>{
   if(snap.exists()){alert('Already registered - login'); showLogin(); return}
   db.ref('users/'+wa).set({name, pin, wa, created:Date.now(), expiry:0, voucher:''});
   currentUser=wa; localStorage.setItem('mzansi_user',wa); showVou();
 });
}
function doLogin(){
 let wa=document.getElementById('logWA').value.trim().replace(/\s/g,'');
 let pin=document.getElementById('logPin').value.trim();
 db.ref('users/'+wa).once('value',snap=>{
   let u=snap.val(); if(!u||u.pin!==pin){alert('Wrong WhatsApp or PIN');return}
   currentUser=wa; localStorage.setItem('mzansi_user',wa); checkExpiry();
 });
}
function checkExpiry(){
 db.ref('users/'+currentUser).once('value',snap=>{
   let u=snap.val(); if(u.expiry && u.expiry>Date.now()) openApp(u); else{ showVou(); document.getElementById('vouMsg').innerText=u.expiry?'Expired - enter new voucher':'Enter voucher R20/month'; }
 });
}
function checkVoucher(){
 let code=document.getElementById('vouInput').value.trim().toUpperCase();
 db.ref('vouchers/'+code).once('value',snap=>{
   let v=snap.val(); if(!v){document.getElementById('vouMsg').innerText='❌ Invalid voucher';return}
   if(v.used && v.usedBy!==currentUser){document.getElementById('vouMsg').innerText='❌ Already used';return}
   let expiry=Date.now()+v.days*24*60*60*1000;
   db.ref('users/'+currentUser).update({expiry, voucher:code});
   db.ref('vouchers/'+code).update({used:true, usedBy:currentUser, usedAt:Date.now()});
   document.getElementById('vouMsg').innerText='✅ Activated '+v.days+' days!';
   setTimeout(()=>db.ref('users/'+currentUser).once('value',s=>openApp(s.val())),1000);
 });
}
function openApp(u){
 document.getElementById('authScreen').classList.add('hidden');
 document.getElementById('appScreen').classList.remove('hidden');
 document.getElementById('welcome').innerText='Sawubona, '+u.name;
 let days=Math.ceil((u.expiry-Date.now())/86400000);
 document.getElementById('expiry').innerText='Active: '+days+' days left until '+new Date(u.expiry).toLocaleDateString();
 initBattery();
}
function setCustom(v){target=parseInt(v); document.getElementById('target').value=target; document.getElementById('slider').value=target; document.getElementById('show').innerText=target+'%';}
async function initBattery(){if('getBattery' in navigator){battery=await navigator.getBattery(); battery.addEventListener('levelchange',upd); battery.addEventListener('chargingchange',upd); upd()} setCustom(localStorage.getItem('mzansi_target')||80)}
function upd(){if(!battery) return; let p=Math.round(battery.level*100); document.getElementById('pct').innerText=p+'%'; document.getElementById('stat').innerText=battery.charging?`Charging ${p}% → Alert at ${target}%`:`${p}%`; if(p>=target&&battery.charging) { if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance('Mntanami battery igcwele khipha shaja manje'); u.lang='zu-ZA'; speechSynthesis.speak(u)} if(navigator.vibrate) navigator.vibrate([500,200,500]); }}
function startAlert(){document.getElementById('startBtn').innerText='🟢 ON - Will shout at '+target+'%'; localStorage.setItem('mzansi_target',target)}
function logout(){localStorage.removeItem('mzansi_user'); location.reload()}
let saved=localStorage.getItem('mzansi_user'); if(saved){currentUser=saved; checkExpiry()}
</script></body></html>
