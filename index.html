<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIGSAM TEST UPLOAD</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:20px}button{background:#ff0055;color:#fff;padding:20px;width:100%;border:none;border-radius:12px;font-size:20px;font-weight:bold;margin-top:15px}input{width:100%;padding:15px;border-radius:10px;margin:10px 0}#log{background:#222;padding:10px;border-radius:10px;white-space:pre-wrap;margin-top:15px;color:#0f0}</style>
</head><body>
<h2>TEST - Storage Only</h2>
<input type="file" id="f">
<button onclick="go()">UPLOAD NOW</button>
<div id="log">Ready...</div>
<script>
const URL="https://ogndqvdzuuufdygkhzae.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nbmRxdmR6dXV1ZmR5Z2toemFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzNjEsImV4cCI6MjEwNDI2NzM2MX0.sPRCVdn9CrEnN48xw8M0FSbGp4UCmkfrU93dHDqE5_4";
async function go(){
  const file=document.getElementById('f').files[0];
  if(!file){document.getElementById('log').innerText="Choose file first";return;}
  document.getElementById('log').innerText="Starting upload: "+file.name+" ("+Math.round(file.size/1024)+" KB)\n";
  const name=Date.now()+"_"+file.name.replace(/[^a-z0-9.\-]/gi,"_");
  try{
    const res=await fetch(`${URL}/storage/v1/object/tracks/${name}`,{
      method:"POST",
      headers:{apikey:KEY,Authorization:"Bearer "+KEY,"x-upsert":"true"},
      body:file
    });
    const txt=await res.text();
    document.getElementById('log').innerText+="Status: "+res.status+"\nResponse: "+txt+"\n";
    if(!res.ok) throw new Error(txt);
    const publicUrl=`${URL}/storage/v1/object/public/tracks/${name}`;
    document.getElementById('log').innerText+="\n✅ SUCCESS!\nURL: "+publicUrl+"\n\n<audio controls src='"+publicUrl+"'></audio>";
    document.getElementById('log').innerHTML+="<br><br><b>File uploaded! Copy URL:</b><br>"+publicUrl+"<br><br><audio controls src='"+publicUrl+"'></audio>";
  }catch(e){
    document.getElementById('log').innerText+="\n❌ FAILED: "+e.message;
  }
}
</script>
</body></html>
