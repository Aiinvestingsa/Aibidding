<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI MUSIC SOCIAL - DJ BIGSAM RSA</title>
<style>
:root{--pink:#ff0055;--cyan:#00f2ff}
body{margin:0;background:#06060a;color:#fff;font-family:Inter,Arial}
header{position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;z-index:10}
.logo{display:flex;gap:10px;align-items:center;font-weight:900}
.logo-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--pink);background:#111}
.ai-badge{background:linear-gradient(90deg,var(--pink),var(--cyan));padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.container{max-width:620px;margin:0 auto;padding:16px}
.card{background:#12121a;border:1px solid #24243a;border-radius:18px;padding:16px;margin:14px 0}
.upload{border:2px dashed #333;border-radius:16px;padding:18px;text-align:center}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#0a0a10;color:#fff;margin:8px 0;box-sizing:border-box}
.btn{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--pink),#ff7a00);color:#fff;font-weight:900;font-size:16px}
.track{display:flex;gap:12px}
.cover{width:72px;height:72px;border-radius:14px;object-fit:cover;background:linear-gradient(135deg,var(--pink),var(--cyan));display:grid;place-items:center;font-size:28px;flex-shrink:0;overflow:hidden}
.meta{flex:1}.meta b{display:block;font-size:16px}
.meta small{color:#888}
audio{width:100%;margin:10px 0}
.actions{display:flex;gap:8px;margin-top:8px}
.actions button{flex:1;padding:10px;border-radius:10px;border:1px solid #333;background:#1a1a2a;color:#fff;font-size:13px}
.counts{display:flex;gap:12px;color:#aaa;font-size:12px;margin-top:6px}
.counts span{color:#fff;font-weight:bold}
.tag{display:inline-block;background:#1e1e32;color:#aaa;padding:3px 8px;border-radius:20px;font-size:11px;margin:2px}
#log{color:#0f0;font-size:12px;white-space:pre-wrap}
.rec-title{font-size:14px;color:var(--cyan);letter-spacing:1px;margin:18px 0 8px 4px}
</style>
</head><body>
<header>
<div class="logo">
<img id="logoImg" class="logo-img" src="https://ogndqvdzuuufdygkhzae.supabase.co/storage/v1/object/public/tracks/logo.jpg" onerror="this.style.display='none'">
<div><span style="color:var(--pink)">AI</span> MUSIC SOCIAL<br><small style="font-weight:400;color:#888;font-size:11px">DJ BIGSAM RSA • DURBAN</small></div>
</div>
<div class="ai-badge" id="playTotal">0 Plays</div>
</header>
<div class="container">
<div class="card">
<div class="upload">
<h3 style="margin:0">🎨 Brand Setup + Upload</h3>
<p style="color:#666;font-size:12px">Upload your logo first (once), then your mixes</p>
<input type="file" id="logoFile" accept="image/*" onchange="uploadLogo()"><small style="color:#888">Choose logo photo → auto saves as cover art</small>
<input type="file" id="file" accept="audio/*" style="margin-top:14px">
<input id="title" placeholder="Track title e.g. Amapiano Sunset Mix">
<button class="btn" onclick="uploadTrack()">🚀 PUBLISH TO FEED</button>
<div id="log">Ready • Logo: using DJ BIGSAM cover • DB: OPEN</div>
</div>
</div>

<div class="rec-title">🤖 AI RECOMMENDED FOR YOU</div>
<div id="recommended"></div>

<div class="rec-title">🔥 LATEST FEED</div>
<div id="feed"></div>
</div>
<script>
const S="https://ogndqvdzuuufdygkhzae.supabase.co"; const K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nbmRxdmR6dXV1ZmR5Z2toemFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzNjEsImV4cCI6MjEwNDI2NzM2MX0.sPRCVdn9CrEnN48xw8M0FSbGp4UCmkfrU93dHDqE5_4";
let LOGO_URL=localStorage.getItem('bigsam_logo')||"https://via.placeholder.com/300x300/ff0055/fff?text=BIGSAM";
document.getElementById('logoImg').src=LOGO_URL; document.getElementById('logoImg').style.display='block';

async function uploadLogo(){
 let f=document.getElementById('logoFile').files[0]; if(!f) return;
 document.getElementById('log').innerText='Uploading logo...';
 let n='logo_'+Date.now()+'.jpg';
 let res=await fetch(`${S}/storage/v1/object/tracks/${n}`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'x-upsert':'true'},body:f});
 if(res.ok){ let url=`${S}/storage/v1/object/public/tracks/${n}`; LOGO_URL=url; localStorage.setItem('bigsam_logo',url); document.getElementById('logoImg').src=url; document.getElementById('log').innerText='✅ Logo saved! Now all covers use your photo';}
}
function getPlays(id){return parseInt(localStorage.getItem('play_'+id)||0)}
function incPlay(id){
 let c=getPlays(id)+1; localStorage.setItem('play_'+id,c);
 document.getElementById('pc_'+id).innerText=c;
 updateTotal();
}
function getDls(id){return parseInt(localStorage.getItem('dl_'+id)||0)}
function incDl(id){
 let c=getDls(id)+1; localStorage.setItem('dl_'+id,c);
 document.getElementById('dl_'+id).innerText=c;
}
function updateTotal(){
 let total=0; document.querySelectorAll('[id^="pc_"]').forEach(e=>total+=parseInt(e.innerText||0));
 document.getElementById('playTotal').innerText=total+' Plays • AI';
}
async function load(){
 let r=await fetch(`${S}/rest/v1/tracks?select=*&order=created_at.desc`,{headers:{apikey:K,Authorization:'Bearer '+K}});
 let j=await r.json();
 let html=j.map(t=>{
  let url=t.file_url||t.url; let id=t.id||t.file_path||url;
  let plays=getPlays(id); let dls=getDls(id);
  return `<div class="card"><div class="track"><img class="cover" src="${LOGO_URL}" onerror="this.src='https://via.placeholder.com/100/ff0055/fff?text=🎧'"><div class="meta"><b>${t.title||'Untitled'}</b><small>DJ BIGSAM • ${new Date(t.created_at).toLocaleDateString()}</small><div class="counts">▶️ <span id="pc_${id}">${plays}</span> plays • ⬇️ <span id="dl_${id}">${dls}</span> downloads</div><div><span class="tag">#amapiano</span><span class="tag">#ai</span><span class="tag">#durban</span></div></div></div><audio controls src="${url}" onplay="incPlay('${id}')"></audio><div class="actions"><button onclick="this.innerText='❤️ Liked'">🤍 Like</button><button onclick="incDl('${id}');window.open('${url}','_blank')">⬇️ Download</button><button onclick="window.open('https://wa.me/?text=🔥 ${encodeURIComponent(t.title||'Mix')} - ${encodeURIComponent(url)}')">🟢 WhatsApp</button></div></div>`;
 }).join('');
 document.getElementById('feed').innerHTML=html;
 // AI Recommended = top 3 most played
 let sorted=[...j].sort((a,b)=>getPlays(b.id||b.url)-getPlays(a.id||a.url)).slice(0,3);
 document.getElementById('recommended').innerHTML=sorted.map(t=>{
  let url=t.file_url||t.url; let id=t.id||url;
  return `<div class="card" style="border-color:var(--cyan)"><div class="track"><img class="cover" src="${LOGO_URL}"><div class="meta"><b>⚡ ${t.title||'Mix'}</b><small>AI Pick • ${getPlays(id)} plays</small></div></div><audio controls src="${url}" onplay="incPlay('${id}')"></audio></div>`;
 }).join('')||'<div class="card">Upload tracks — AI will recommend top plays</div>';
 updateTotal();
}
async function uploadTrack(){
 let f=document.getElementById('file').files[0]; if(!f) return alert('Choose audio');
 let title=document.getElementById('title').value||f.name;
 document.getElementById('log').innerText='Uploading...';
 let n=Date.now()+'_'+f.name.replace(/[^a-z0-9.\-]/gi,'_');
 let res=await fetch(`${S}/storage/v1/object/tracks/${n}`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'x-upsert':'true'},body:f});
 if(!res.ok){let txt=await res.text(); return document.getElementById('log').innerText='❌ '+txt;}
 let url=`${S}/storage/v1/object/public/tracks/${n}`;
 await fetch(`${S}/rest/v1/tracks`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({title:title,file_url:url,url:url})});
 document.getElementById('log').innerText='🔥 PUBLISHED with your logo cover!'; load();
}
load();
</script>
</body></html>
